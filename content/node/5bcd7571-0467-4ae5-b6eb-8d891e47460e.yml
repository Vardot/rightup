      value: |-
        <p><strong>Idris Calloway:</strong> On Last Call this week, something we have never aired before. Tomas Reyna has given us permission to talk through the room tone of a pitch that fell apart while he was leading it, including the silence. Tomas, thanks for coming back to it.</p>
        <p><strong>Tomas Reyna:</strong> Thank you, Idris. I have listened to that recording more times than is healthy.</p>
        <p><strong>Idris Calloway:</strong> Set the scene. Who was the client, and what was at stake?</p>
        <p><strong>Tomas Reyna:</strong> A regional bank, about forty branches, rebranding after a merger. We were one of three agencies on the shortlist. The account was worth roughly six hundred thousand over two years, which for a studio of twenty-two people is the year.</p>
        <p><strong>Idris Calloway:</strong> And the recording exists because?</p>
        <p><strong>Tomas Reyna:</strong> The bank recorded every pitch for its procurement file. Afterwards I asked for ours. Legal took four months to say yes.</p>
        <p><strong>Idris Calloway:</strong> So where does it go wrong?</p>
        <p><strong>Tomas Reyna:</strong> About eleven minutes in. Their head of retail asks, quite gently, who the work is really for. Customers, staff, or the board. And I realise our whole deck is written for the board. I open my mouth and nothing comes out.</p>
        <p><strong>Idris Calloway:</strong> How long is the silence?</p>
        <p><strong>Tomas Reyna:</strong> Thirty-one seconds. On the recording you can hear the air conditioning, somebody's pen clicking, and my colleague Inge shifting her chair because she is deciding whether to rescue me.</p>
        <p><strong>Inge Vasquez:</strong> I decided not to, which I still think about. It was his question to answer, and if I jumped in it would look like we did not agree with each other.</p>
        <p><strong>Idris Calloway:</strong> What did you eventually say, Tomas?</p>
        <p><strong>Tomas Reyna:</strong> Something about all three audiences being equally important. Which is the answer you give when you have no answer. You can hear the room cool on the tape.</p>
        <p><strong>Idris Calloway:</strong> The description says the recovery came two minutes too late.</p>
        <p><strong>Tomas Reyna:</strong> Yes. At minute fourteen I skipped to the staff section, which was the strongest thing we had, a set of branch uniforms and a counter redesign the tellers had helped us test. That part of the recording is good. People ask questions, someone laughs. But by then the head of retail had stopped writing.</p>
        <p><strong>Inge Vasquez:</strong> The feedback letter said our thinking was strong and our priorities were unclear. Which is a polite way of saying the silence.</p>
        <p><strong>Idris Calloway:</strong> What changed after?</p>
        <p><strong>Tomas Reyna:</strong> Two things. We now write a one-line answer to who the work is for and put it on the first slide, and we rehearse with someone whose only job is to ask the uncomfortable question. Usually Inge.</p>
        <p><strong>Inge Vasquez:</strong> I enjoy it far too much.</p>
        <p><strong>Idris Calloway:</strong> Tomas Reyna, Inge Vasquez, thank you. That is Last Call.</p>
      format: full_html
