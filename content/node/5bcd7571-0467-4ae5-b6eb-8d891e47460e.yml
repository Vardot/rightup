  field_content:
  - value: '<p><strong>Noor Fasi:</strong> Let us start where most people would not. What did this cost you?</p>

      <p><strong>Guest:</strong> Time, mostly. About eleven weeks we did not bill for. The money we can explain to ourselves. The eleven weeks are harder.</p>

      <p><strong>Noor Fasi:</strong> And you would do it again.</p>

      <p><strong>Guest:</strong> We are doing it again. That is the honest answer. We have two projects running the same way right now, and one of them is already late.</p>

      <p><strong>Noor Fasi:</strong> Walk me through the moment you knew it was working.</p>

      <p><strong>Guest:</strong> There was a meeting about six weeks in where nobody presented anything. We sat with the client and read the brief out loud, line by line, and changed four words. Everything
      after that was easier, and I cannot fully tell you why.</p>

      <p><strong>Noor Fasi:</strong> Four words.</p>

      <p><strong>Guest:</strong> Four words. We had written "a space for events" and they said, no, it is a space that survives events. Same building. Completely different set of decisions.</p>

      <p><strong>Noor Fasi:</strong> What would you tell a studio about to try this?</p>

      <p><strong>Guest:</strong> Cost it properly, and tell the client what you are doing. The method only works if both sides know they are allowed to change their minds early. If you hide it, it just
      looks like you are slow.</p>'
    format: full_html
  field_description:
  - value: We got permission to play the room tone from a pitch that fell apart in real time, including the thirty seconds of silence nobody wanted to fill and the recovery attempt that came two minutes
      too late to save the account.
