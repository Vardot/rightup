  field_content:
  - value: '<p><strong>Noor Fasi:</strong> This is The RightUp. I''m Noor Fasi. Today we''re doing something we''ve never done. We have permission to talk through the room tone of a pitch that fell apart
      in real time. Tomas Reyna was the creative director in that room. Tomas, welcome.</p>

      <p><strong>Tomas Reyna:</strong> Thanks, Noor. I still can''t listen to it without wincing.</p>

      <p><strong>Noor Fasi:</strong> Take us to the moment it turned.</p>

      <p><strong>Tomas Reyna:</strong> About eleven minutes in, the client asked who the work was really for. I opened my mouth, and nothing came out.</p>

      <p><strong>Noor Fasi:</strong> And then?</p>

      <p><strong>Tomas Reyna:</strong> Thirty seconds of silence. On the recording it sounds like a fan and somebody''s pen clicking. Nobody on our side wanted to be the one to fill it.</p>

      <p><strong>Noor Fasi:</strong> Thirty seconds feels short when you say it.</p>

      <p><strong>Tomas Reyna:</strong> It isn''t. In a pitch room it''s a lifetime. You can hear the client decide, somewhere in the middle of it.</p>

      <p><strong>Noor Fasi:</strong> You did try to recover.</p>

      <p><strong>Tomas Reyna:</strong> We did, about two minutes later. A good answer, honestly. It just came after they''d already stopped listening.</p>

      <p><strong>Noor Fasi:</strong> What changed in the studio after that?</p>

      <p><strong>Tomas Reyna:</strong> We rehearse the hardest question now, out loud, before every pitch. And whoever''s closest to the answer is allowed to take it, whatever their title is.</p>

      <p><strong>Noor Fasi:</strong> Tomas Reyna, thank you for letting us sit in that silence. That''s What a Rejected Pitch Actually Sounds Like, on The RightUp.</p>'
    format: full_html
  field_description:
  - value: We got permission to play the room tone from a pitch that fell apart in real time, including the thirty seconds of silence nobody wanted to fill and the recovery attempt that came two minutes
      too late to save the account.
