  field_content:
  - value: '<p>Four of the most talked-about rebrands this year launched without a tagline.</p>

      <p>Strategists say the line under the logo has moved into campaigns, where it can change every season.</p>

      <h2>In practice</h2>

      <p>The logo, they argue, should say less and last longer.</p>

      <blockquote><p>A tagline is a campaign that forgot to end.</p><footer>Brand strategist, London</footer></blockquote>'
