  field_content:
    -
      value: "<p><strong>Idris Calloway:</strong> Last Call, with me Idris Calloway. A product team was asked by its own client to make a launch screen look worse, and agreed. Carmen Vidal led the design, and her research lead Owen Mbeki is here too. Carmen, what was the product?</p><p><strong>Carmen Vidal:</strong> An invoicing app for tradespeople: plumbers, electricians, tilers. Mostly sole traders who send ten or twenty invoices a month from a van. The client was a small company in Valencia that had built the accounting engine and needed a front end.</p><p><strong>Idris Calloway:</strong> And your first version of the launch screen?</p><p><strong>Carmen Vidal:</strong> Honestly, it was lovely. A custom illustration of a van, a soft gradient, two typefaces, a pricing card that floated. We were proud of it.</p><p><strong>Idris Calloway:</strong> Owen, what did the users say?</p><p><strong>Owen Mbeki:</strong> We ran twelve sessions in builders' merchants, at the counter, at seven in the morning when the trade buys materials. The phrase that came back again and again was some version of, this looks like it costs more than they say it does. One electrician asked whether the price on the screen was per week.</p><p><strong>Carmen Vidal:</strong> The client watched two of those sessions on video and the next day the founder asked us to make it uglier. Those were his words.</p><p><strong>Idris Calloway:</strong> What did you actually take out?</p><p><strong>Carmen Vidal:</strong> The illustration, the gradient, the second typeface and the floating card. We moved the price to the top in plain black, set in the same face as the rest. We added a photograph of an actual invoice, a bit crumpled, taken on a van dashboard.</p><p><strong>Idris Calloway:</strong> And the numbers?</p><p><strong>Owen Mbeki:</strong> Sign-ups from the landing screen went up eleven percent over the next six weeks against the old version, on about nine thousand visits each. Small numbers, but the direction did not wobble.</p><p><strong>Idris Calloway:</strong> Carmen, did that sting?</p><p><strong>Carmen Vidal:</strong> For about a week. What I had made was a screen that pleased designers. What the users wanted was a screen that looked like it was made by someone who understood their margins. Those are different audiences, and I had been designing for the wrong one.</p><p><strong>Idris Calloway:</strong> Is there a lesson you would not want people to take from this?</p><p><strong>Owen Mbeki:</strong> That ugly converts. It does not. Plain converted here because the audience distrusts polish. Show the same screen to a law firm and I would expect the opposite.</p><p><strong>Idris Calloway:</strong> Carmen Vidal and Owen Mbeki, thank you. This has been Last Call.</p>"
      format: full_html
  field_description:
