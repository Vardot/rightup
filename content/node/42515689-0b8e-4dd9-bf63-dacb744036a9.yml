      value: "<p><strong>Beatriz Solano:</strong> Welcome to Office Hours, where founders take the questions younger designers would rather not ask out loud. I'm Beatriz Solano. Today's question came in eleven times this month: how do I price my first project? With me are Naledi Khumalo, who runs a five-person identity studio in Johannesburg, and Pieter Vos, who set up an exhibition design practice in Rotterdam nine years ago.</p><p><strong>Naledi Khumalo:</strong> Happy to be here. And eleven sounds low, honestly.</p><p><strong>Beatriz Solano:</strong> Naledi, where does a first number come from?</p><p><strong>Naledi Khumalo:</strong> From a spreadsheet, not from a feeling. Rent, software, insurance, your accountant, the laptop you will replace in three years. Divide that by the hours you can actually bill, which is about sixty percent of the hours you work. That gives you a floor. Most graduates have never done that sum, so they quote whatever their friend charged.</p><p><strong>Beatriz Solano:</strong> What did your first quote look like?</p><p><strong>Naledi Khumalo:</strong> A logo and stationery for a bakery, eight thousand rand. It took me ninety hours. I was paid less than the person serving coffee at the counter, and I did not even get free bread.</p><p><strong>Pieter Vos:</strong> Mine was worse. I quoted a museum by the day, three days, and the curator changed the brief on day two. I spent four weeks on it.</p><p><strong>Beatriz Solano:</strong> So day rate or fixed fee?</p><p><strong>Pieter Vos:</strong> Fixed fee for the client, day rate in your head. You estimate the days, multiply by your rate, then add a third for the meetings nobody puts in the plan. The client sees one number. You see the days, and when you blow through them you know exactly where.</p><p><strong>Beatriz Solano:</strong> The third for meetings is real?</p><p><strong>Pieter Vos:</strong> I tracked it for two years. Thirty-one percent of our time on exhibition projects was coordination: lighting designers, conservators, the fire officer. None of it was in the original scope.</p><p><strong>Naledi Khumalo:</strong> The other thing graduates forget is the second round. Write down how many rounds of changes the fee covers. Two is normal. After that it is a new line on a new invoice.</p><p><strong>Beatriz Solano:</strong> What about the client who says the budget is fixed at a number well below yours?</p><p><strong>Naledi Khumalo:</strong> Then you take things out, not money out. Fewer applications, one typeface instead of a family, no animated version. If you drop the price and keep the scope, you have told them your first number was invented.</p><p><strong>Pieter Vos:</strong> And you will be quoting that lower number to their friends for the next five years. Clients talk to each other more than designers do.</p><p><strong>Beatriz Solano:</strong> Last question. Should a graduate publish a price list?</p><p><strong>Pieter Vos:</strong> No. Publish a starting point if you must. A first price is a guess you refine for about twenty projects.</p><p><strong>Naledi Khumalo:</strong> Keep every quote and every timesheet. By project twelve, your spreadsheet knows more than you do.</p><p><strong>Beatriz Solano:</strong> Naledi Khumalo, Pieter Vos, thank you. That's Office Hours.</p>"
