    -
      value: "<p><strong>Malik Osei:</strong> There's a steady clatter in here, like a sewing machine with hiccups. That's a Monotype caster, one of nine in this workshop, making metal type one letter at a time. This is Field Notes, I'm Malik Osei, and the woman feeding it is Greta Lindahl, one of the two people who work here. Greta, what's it casting right now?</p><p><strong>Greta Lindahl:</strong> Lowercase e, twelve point, in a Caslon. Six hundred of them. It makes about a hundred and forty a minute, so this order takes around five minutes of casting and about an hour of setting up.</p><p><strong>Malik Osei:</strong> Who orders six hundred lowercase e's in 2026?</p><p><strong>Greta Lindahl:</strong> A printer who lost theirs. That's honestly most of our work. Somebody drops a type case, half the e's roll under a cabinet, and they phone me. E is the most used letter in English, so it wears out first and gets lost first. I cast more e's than the rest of the alphabet put together.</p><p><strong>Malik Osei:</strong> How does the machine know what shape to make?</p><p><strong>Greta Lindahl:</strong> From the matrix, this small bronze block with the letter struck into it. Each machine holds a case of two hundred and twenty-five matrices. Molten metal, mostly lead with tin and antimony, is pumped into the mould at about three hundred and forty degrees, against the matrix, and a second later a finished letter drops out on the right.</p><p><strong>Malik Osei:</strong> It's still hot.</p><p><strong>Greta Lindahl:</strong> Don't pick it up. Give it ten seconds.</p><p><strong>Malik Osei:</strong> Where do the matrices come from?</p><p><strong>Greta Lindahl:</strong> Everywhere. Bought from closing foundries, mostly in the eighties and nineties. Some of ours are from 1911. You can't easily make new ones any more, so we treat them carefully. A matrix that cracks is a letter that may never exist again in that size.</p><p><strong>Malik Osei:</strong> What breaks most?</p><p><strong>Greta Lindahl:</strong> The machines, a little every day. They're from the 1950s. My colleague Piet spends most mornings with a spanner. We have a tenth machine at the back that has never run; we take parts from it.</p><p><strong>Malik Osei:</strong> I can see shelves of paper ribbons with holes punched in them.</p><p><strong>Greta Lindahl:</strong> That's the other way of using the caster. A keyboard operator types the text and it punches the ribbon; then the caster reads the ribbon and casts whole lines in order. We still do that for small poetry presses. A book of forty pages is about three days of casting.</p><p><strong>Malik Osei:</strong> And the metal?</p><p><strong>Greta Lindahl:</strong> Recycled forever. Customers send old type back, we melt it down in that pot, and it becomes new type. Some of this alloy has probably been a hundred different books.</p><p><strong>Malik Osei:</strong> Greta Lindahl, thank you. From the type foundry floor, this has been Field Notes.</p>"
      format: full_html
