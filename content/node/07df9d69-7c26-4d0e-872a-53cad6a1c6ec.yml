  field_content:
  - value: '<p>From the street the building is white. Every way in is blue or yellow, and you can find the door from a hundred metres away without reading a sign.</p>

      <p>Buildings of this kind are rarely decided by architects alone. A structural engineer, a planning officer and a facilities manager who will never be named in the credits each moved this one several
      metres from where it started, and the drawings record the argument.</p>

      <p>Rena Osei, reporting from the opening week, has been close to it from the start.</p>

      <h2>The decision</h2>

      <p>Colour is used only where the wall is cut. Nothing is painted for decoration, so the palette maps exactly onto the way in and the way through.</p>

      <p>The timeline tells its own story: eighteen months from first conversation to the point anyone outside the room saw anything, and then six weeks in which everything visible was decided.</p>

      <p>The approach has one weakness, and the architects name it themselves: change the programme and the colour lies.</p>

      <blockquote><p>Children found the entrances before the adults did. They were not reading. They were following the yellow.</p><footer>the building manager</footer></blockquote>

      <h2>In practice</h2>

      <p>The budget for signage was folded into the paint schedule, which is how a community centre with no wayfinding consultant ended up with wayfinding.</p>

      <p>What stops this being a one-off is the documentation. The practice has published the details, which means the next team does not have to rediscover the same three failures.</p>

      <p>Reaction has split along predictable lines. The people who have to maintain it have the sharpest questions, and the fairest ones.</p>

      <p>There is no shortage of people willing to call it inevitable in hindsight. Nobody involved describes it that way.</p>

      <h2>What comes next</h2>

      <p>It has been open four months, and the yellow door is already the one everybody uses.</p>'
    format: full_html
  field_description:
