  field_content:
  - value: '<p>Puu Works first drew its folding stool in 2014. The version going on sale this month is the eleventh prototype.</p>

      <p>The problem was the hinge. Every earlier version either wobbled when open or pinched fingers when closed.</p>

      <h2>In practice</h2>

      <p>The final design uses a single brass pin and a birch leg that locks against a shoulder cut into the seat.</p>

      <blockquote><p>Ten years sounds long until you sit on the first nine.</p><footer>Eero Lindqvist, founder</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'A Finnish maker finally put its three-legged stool into production after eleven prototypes.'
