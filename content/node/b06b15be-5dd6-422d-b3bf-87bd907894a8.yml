    langcode: en
  field_content:
  - value: '<p>Three practices, one lease, and a client list they have agreed to share before they have agreed how to split it.</p>

      <p>It is the kind of decision that looks obvious written down and costs somebody a difficult quarter in practice.</p>

      <p>Lea Wren, who brokered the arrangement, has been close to it from the start.</p>

      <h2>The decision</h2>

      <p>The collective takes a single floor in a former printworks, with one set of overheads and three separate bank accounts.</p>

      <p>The timeline tells its own story: eighteen months from first conversation to the point anyone outside the room saw anything, and then six weeks in which everything visible was decided.</p>

      <p>The arrangement has one obvious failure mode, and they have written it into the agreement: any partner can leave with their own clients on ninety days'' notice.</p>

      <blockquote><p>We are not merging. We are refusing to compete for the same eight jobs.</p><footer>Wren</footer></blockquote>

      <h2>In practice</h2>

      <p>Work comes in to the collective and is assigned by whoever has capacity, which means a client may be pitched by one studio and delivered by another.</p>

      <p>Studios copy each other faster than they admit. Expect three versions of this arrangement by next summer, at least one of them badly costed.</p>

      <p>Reaction has split along predictable lines. The people who have to maintain it have the sharpest questions, and the fairest ones.</p>

      <p>What they will not say, on the record, is how close it came to being cancelled in the spring.</p>

      <h2>What comes next</h2>

      <p>They take their first shared commission in October.</p>'
