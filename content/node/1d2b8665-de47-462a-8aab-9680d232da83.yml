      value: "<p><strong>Noor Fasi:</strong> Welcome to Small Practice, on The Rightup. I'm Noor Fasi. Rafael Montoya works at an eleven-person architecture and product studio in Valencia. On their website there are eleven names, eleven photographs, and no job titles at all. Rafael, welcome.</p><p><strong>Rafael Montoya:</strong> Thank you, Noor. Eleven names, in alphabetical order, which means I am usually near the bottom.</p><p><strong>Noor Fasi:</strong> When did the titles go?</p><p><strong>Rafael Montoya:</strong> In 2020. The founders realised that the title Associate Director was being used in fee negotiations to justify a rate, and not to describe what anybody did. So they took them off the site, then off the email signatures, then off the contracts.</p><p><strong>Noor Fasi:</strong> Off the contracts? Clients often insist on a named lead.</p><p><strong>Rafael Montoya:</strong> They still get one. Every appointment names a project lead by person, not by rank. On the market hall in Alzira the lead was Lucía, who was twenty-eight. On the next job she was supporting someone else. Leadership travels with the project.</p><p><strong>Noor Fasi:</strong> So what happens when a client walks in and asks who is in charge?</p><p><strong>Rafael Montoya:</strong> We say the name of whoever is running their job. If they push and ask who is in charge of the studio, we explain that the two founders own it and sign the accounts, but they do not overrule a project lead on design. Most clients find that reassuring. A few do not.</p><p><strong>Noor Fasi:</strong> Tell me about one who did not.</p><p><strong>Rafael Montoya:</strong> A hotel developer from Madrid. Second meeting, he looked around the table and said, I want to speak to the boss. We said the boss of his project was Pau, who was sitting next to him. He shook Pau's hand, went back to Madrid, and appointed someone else.</p><p><strong>Noor Fasi:</strong> Did that make you reconsider?</p><p><strong>Rafael Montoya:</strong> We discussed it for an afternoon. It was a two hundred thousand euro fee. We decided that a client who needs a hierarchy to trust us will need one at every difficult moment, and those moments are where the money is lost anyway.</p><p><strong>Noor Fasi:</strong> What about pay, without titles?</p><p><strong>Rafael Montoya:</strong> Pay is banded by years in practice and published internally. There are four bands. Everyone knows everyone's salary. That was harder than removing titles, honestly. It took two years and one person left over it.</p><p><strong>Noor Fasi:</strong> And career progression?</p><p><strong>Rafael Montoya:</strong> You progress by leading bigger projects. Nobody needs a word on a business card to know who led the market hall.</p><p><strong>Noor Fasi:</strong> Rafael Montoya, thank you. That's Small Practice.</p>"
      format: full_html
  field_description:
    -
      value: 'Eleven people, no seniority, no titles on the website. What happens when a client asks who is in charge.'
