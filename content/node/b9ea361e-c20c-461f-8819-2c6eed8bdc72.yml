      value: "<p><strong>Noor Fasi:</strong> On Small Practice this week, the sound of a bandsaw. I'm Noor Fasi, on The Rightup, and I'm in Turin, in a model shop of three people run by Giulia Santoro. Giulia, welcome.</p><p><strong>Giulia Santoro:</strong> Welcome. Mind the offcuts, the floor is mostly foam.</p><p><strong>Noor Fasi:</strong> What do you make here?</p><p><strong>Giulia Santoro:</strong> Architectural models, mostly at one to two hundred and one to fifty, for about twenty practices in Piedmont and Lombardy. Foam board, grey card, limewood, acrylic for glazing, and a lot of brass rod. We have a laser cutter, but we use it for parts, not for whole models.</p><p><strong>Noor Fasi:</strong> The description says you refuse to go digital. Is that fair?</p><p><strong>Giulia Santoro:</strong> Half fair. We draw in CAD and we cut on a laser. What we refuse is to replace the physical model with a rendering or a VR headset, which three clients have asked us to help them do.</p><p><strong>Noor Fasi:</strong> Why do clients still pay for physical models in 2026?</p><p><strong>Giulia Santoro:</strong> Because a committee cannot zoom. A planning committee of nine councillors looking at a screen each see a different building. Around a model on a table they see the same thing, at the same size, at the same time. The arguments are shorter and they end.</p><p><strong>Noor Fasi:</strong> Is there evidence of that, or is it a feeling?</p><p><strong>Giulia Santoro:</strong> One of our clients, a practice in Milan, tracked it on their own projects. Schemes they presented with a physical model went through planning with fewer conditions on average. They paid for this model behind you because of that spreadsheet.</p><p><strong>Noor Fasi:</strong> What does a model like that cost?</p><p><strong>Giulia Santoro:</strong> That one, a school at one to one hundred with a removable roof, around six thousand five hundred euros and four weeks. A massing model for a competition, perhaps eight hundred and two days.</p><p><strong>Noor Fasi:</strong> How do you compete with practices printing their own models?</p><p><strong>Giulia Santoro:</strong> Many of them tried. A 3D printer prints a building that looks like plastic, because it is. Clients see the layer lines. We still finish printed parts for some offices, sanding and painting, which is very boring work and pays very well.</p><p><strong>Noor Fasi:</strong> Who will take this over?</p><p><strong>Giulia Santoro:</strong> My apprentice, Tommaso, is twenty-three and better with a scalpel than I am. That is the hardest thing to find.</p><p><strong>Noor Fasi:</strong> Giulia Santoro, thank you. That's Small Practice.</p>"
      format: full_html
