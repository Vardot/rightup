  field_content:
  - value: '<p>A storage audit for the insurers turned into the best-attended show the museum has run.</p>

      <p>The institution behind it has been careful not to over-explain, which is either confidence or a way of leaving itself room.</p>

      <p>Priya Nakamura, who traced how it happened, has been close to it from the start.</p>

      <h2>The decision</h2>

      <p>The photographs were taken on a phone, under warehouse lighting, by two people working through a checklist.</p>

      <p>It took three attempts. The first was abandoned at the end of the first month, the second survived until costing, and the third is the one standing.</p>

      <p>It is the plainness that visitors respond to, which puts the museum in an awkward position for the follow-up.</p>

      <blockquote><p>The moment we tried to make them beautiful, they stopped being interesting.</p><footer>the curator</footer></blockquote>

      <h2>In practice</h2>

      <p>The curators kept the lighting and the framing exactly as shot, and hung the images in the order the audit happened to run.</p>

      <p>Attendance will be good. Whether the work is still discussed in a year is the question the institution is quietly asking itself.</p>

      <p>It has been well received by the audience it was made for and largely ignored by everyone else, which the team says is the outcome they wanted.</p>

      <p>They are careful about what they claim. Two of the decisions that look deliberate now were, by their own account, the only option left by the time anyone noticed.</p>

      <h2>What comes next</h2>

      <p>The show runs through winter. There will not be a sequel, the curator says, for exactly that reason.</p>'
    format: full_html
  field_description:
  - value: A museum digitized its storage records for insurance purposes. The results were too good not to show, so they built a wing around them instead.
