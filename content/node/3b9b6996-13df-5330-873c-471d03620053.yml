  field_content:
  - value: '<p>Who is it for, what should change, how will we know, what can''t move, and who decides. Five questions, asked before any fee is quoted.</p>

      <p>Studios that use the list say it filters out half their enquiries in the first call.</p>

      <h2>In practice</h2>

      <p>The rest start faster, because the hardest conversation has already happened.</p>

      <blockquote><p>A brief is a promise about what success looks like.</p><footer>Design director, Berlin</footer></blockquote>'
