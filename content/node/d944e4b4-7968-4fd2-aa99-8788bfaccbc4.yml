  - alias: /news/studios-new-icon-set-ditches-every-convention
    langcode: en
  field_content:
  - value: '<p>No rounded corners. No consistent stroke weight. A triangle where a play button should be, pointing very slightly downward.</p>

      <p>The system has to survive people who do not care about it. That is the actual test, and it happens in procurement, in email signatures and on signage nobody briefed.</p>

      <p>Tomas Adeyemi, who saw the set in progress, has been close to it from the start.</p>

      <h2>Background</h2>

      <p>The set was drawn at 48 pixels and never tested smaller, which the studio treats as a constraint rather than an oversight.</p>

      <p>The timeline tells its own story: eighteen months from first conversation to the point anyone outside the room saw anything, and then six weeks in which everything visible was decided.</p>

      <p>The client tested it against their old set with 400 users, and comprehension went up on 14 icons and down on three.</p>

      <blockquote><p>Consistency is a way of avoiding decisions. We made 60 decisions instead.</p><footer>the studio''s founder</footer></blockquote>

      <h2>The method</h2>

      <p>Each icon breaks one rule and only one, so the family holds together while no two members share a grid.</p>

      <p>The system survives or fails on its worst application, not its best, and nobody presents that slide.</p>

      <p>Reaction has split along predictable lines. The people who have to maintain it have the sharpest questions, and the fairest ones.</p>

      <p>There is no shortage of people willing to call it inevitable in hindsight. Nobody involved describes it that way.</p>

      <h2>Where it goes</h2>

      <p>The three that lost are being redrawn. The rest ship next month.</p>'
    format: full_html
