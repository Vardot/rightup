  field_content:
  - value: '<p>Most design studios produce far more sketches than any client sees. We asked three how they keep them.</p>

      <p>One scans every page into a shared drive tagged by project. One binds them into a yearly book. One throws them away on purpose.</p>

      <h2>In practice</h2>

      <p>All three agree the habit matters more than the method.</p>

      <blockquote><p>The archive is for the next junior, not for us.</p><footer>Studio lead, Amsterdam</footer></blockquote>'
    format: full_html
