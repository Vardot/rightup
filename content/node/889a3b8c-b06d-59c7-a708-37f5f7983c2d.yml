  field_content:
  - value: '<p>Each Mar chair uses around one and a half kilograms of nylon recovered from fishing nets off the Portuguese coast.</p>

      <p>The shells come in four colours that follow the colour of the nets, so batches vary.</p>

      <h2>In practice</h2>

      <p>The manufacturer reports the tonnage collected every quarter.</p>

      <blockquote><p>The colour is whatever the sea gives us.</p><footer>Rui Almeida, founder</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'A Portuguese manufacturer turns ghost nets into seat shells and publishes the tonnage.'
