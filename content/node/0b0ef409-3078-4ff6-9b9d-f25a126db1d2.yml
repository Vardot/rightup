  field_content:
    -
      value: "<p><strong>Malik Osei:</strong> It is ten past six in the morning, the radiators are still cold, and I'm in a letterpress studio in a former bakery with Odile Ferrand, who has printed here for nineteen years. This is Field Notes. Odile, the first thing you did when you unlocked the door was not turn on a light. You went and touched the paper.</p><p><strong>Odile Ferrand:</strong> I always do. This stack is a cotton stock, three hundred grams, and it came in yesterday afternoon. If it sat near the door overnight it would have taken on water from the street, and damp paper stretches. Stretched paper doesn't register. The second colour lands half a millimetre off and you've wasted a morning.</p><p><strong>Malik Osei:</strong> How can you tell by touching it?</p><p><strong>Odile Ferrand:</strong> Cold paper feels damp even when it isn't, so it's not the temperature. It's the edges. If they wave, it's taken on moisture. These are flat. We're fine.</p><p><strong>Malik Osei:</strong> Now the lights are on. There are three presses in here. Which one are we using?</p><p><strong>Odile Ferrand:</strong> The Heidelberg windmill. 1962. It's the one that runs the long jobs. Today is four hundred wedding invitations, two colours, a deep green and a copper.</p><p><strong>Malik Osei:</strong> And the reason you start at six?</p><p><strong>Odile Ferrand:</strong> The ink. Rubber-based ink stays open on the rollers for hours, which is lovely, but its tack changes with the temperature. At six the room is twelve degrees and the ink is stiff and behaves. By ten the heating has been on and the sun is on the windows, and it gets loose and starts to fill in the counters of small type. So the fine work happens first.</p><p><strong>Malik Osei:</strong> She's now putting ink onto the disc with a knife. How much?</p><p><strong>Odile Ferrand:</strong> Less than people think. A strip about the size of a fingernail for the first run. You let the rollers spread it for a few minutes and listen. Too much ink and it hisses. Too little and it sounds dry, almost papery. You want a soft, even sound.</p><p><strong>Malik Osei:</strong> I can hear it. It sounds like rain on a tent.</p><p><strong>Odile Ferrand:</strong> That's right. That's the sound.</p><p><strong>Malik Osei:</strong> Then the first proof.</p><p><strong>Odile Ferrand:</strong> On newsprint, never on the good stock. I check the impression from the back. With this paper the client wants a bite you can feel with a fingertip, about point two of a millimetre. Any deeper and it shows through on the reverse, where their names are going to go.</p><p><strong>Malik Osei:</strong> The proof has just come off. What do you see?</p><p><strong>Odile Ferrand:</strong> The copper is fine. The green is heavy on the left. The rollers aren't quite parallel to the bed; it's been cold. A quarter turn on this screw. Then another proof, and probably one more. On a normal morning I make six proofs before the first sheet I'd sell.</p><p><strong>Malik Osei:</strong> Odile Ferrand, thank you. That was the first hour of a print shop, for Field Notes.</p>"
