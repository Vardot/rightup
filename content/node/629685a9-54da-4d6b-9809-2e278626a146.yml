      value: |-
        <p><strong>Idris Calloway:</strong> I'm Idris Calloway and this is Last Call. A studio in Lisbon handed its whole office to its newest hire for one month: no oversight, no budget cap, and the partners away for two weeks in Japan. Lena Sato was that hire, and the partner who agreed to it, Duarte Pinheiro, is here too. Welcome to you both.</p>
        <p><strong>Lena Sato:</strong> Thank you. I was three weeks into the job when they told me.</p>
        <p><strong>Duarte Pinheiro:</strong> And I was the one who insisted on no budget cap, which my business partner has not let me forget.</p>
        <p><strong>Idris Calloway:</strong> Duarte, why do it at all?</p>
        <p><strong>Duarte Pinheiro:</strong> We had been in the same layout for nine years. Every senior person had an opinion about the office, and those opinions cancelled each other out. I wanted someone who had not yet learned what was impossible.</p>
        <p><strong>Idris Calloway:</strong> Lena, where did you start?</p>
        <p><strong>Lena Sato:</strong> I spent the first week just watching. I timed how long people spent standing at the plotter, where they took phone calls, which desks were empty on which days. The big finding was that the meeting room was booked solid but people only used it for calls, because the open floor was too loud.</p>
        <p><strong>Idris Calloway:</strong> So what did you build?</p>
        <p><strong>Lena Sato:</strong> I took the meeting room apart. The table went to the middle of the studio as a shared work surface, and I built four phone booths out of plywood and recycled felt in the old room. Then I moved the partners' desks from the window to the back wall, next to the kitchen.</p>
        <p><strong>Duarte Pinheiro:</strong> Which we found out about from a photo on the studio group chat while we were in Osaka.</p>
        <p><strong>Idris Calloway:</strong> How much did it cost?</p>
        <p><strong>Lena Sato:</strong> Fourteen thousand two hundred euros. The booths were most of it. A carpenter friend helped on two weekends.</p>
        <p><strong>Idris Calloway:</strong> And when the partners came back?</p>
        <p><strong>Duarte Pinheiro:</strong> Honestly, I was angry for about a day. The window desk was the one thing I cared about. Then I noticed I was overhearing every project conversation from the kitchen wall, which I had not done in years. I knew more about our work in a week than in the previous quarter.</p>
        <p><strong>Lena Sato:</strong> Not everything worked. The big shared table is too loud for drawing, and two people asked to go back to their old desks. We let them.</p>
        <p><strong>Idris Calloway:</strong> The description says it surprised people in both directions.</p>
        <p><strong>Duarte Pinheiro:</strong> The booths were used by everyone, constantly, so that was a win. But we lost the only room where a client could see a full presentation wall, and we have had to hire space twice for big reviews.</p>
        <p><strong>Idris Calloway:</strong> Would you do it again?</p>
        <p><strong>Duarte Pinheiro:</strong> Next year, with a different hire. And yes, a budget cap.</p>
        <p><strong>Idris Calloway:</strong> Lena Sato, Duarte Pinheiro, thank you. That is Last Call.</p>
      format: full_html
  field_description:
    -
      value: 'A studio hands its physical space over to its newest hire for one month, no oversight, no budget cap, and no way to undo it before the partners return from a two-week trip abroad. What came back was not what anyone expected, in either direction.'
