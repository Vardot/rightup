  field_content:
  - value: '<p><strong>Idris Calloway:</strong> This is The RightUp, and I''m Idris Calloway. Picture a studio handing its entire physical space to its newest hire. One month, no oversight, no budget cap,
      and the partners abroad for two weeks with no way to undo anything. Lena Sato was that hire. Lena, welcome.</p>

      <p><strong>Lena Sato:</strong> Thank you. I was three weeks into the job when they told me.</p>

      <p><strong>Idris Calloway:</strong> What was your first thought?</p>

      <p><strong>Lena Sato:</strong> Honestly, that it was a test I was supposed to refuse. It wasn''t.</p>

      <p><strong>Idris Calloway:</strong> So where did you start?</p>

      <p><strong>Lena Sato:</strong> I watched how people actually worked for five days before moving a single desk. Nobody used the meeting room. Everyone took calls in the stairwell.</p>

      <p><strong>Idris Calloway:</strong> And what did you change?</p>

      <p><strong>Lena Sato:</strong> I took out the meeting room and built four small phone booths. I moved the partners'' desks into the middle of the floor, and I put the model workshop right by the entrance,
      so clients walk past the work first.</p>

      <p><strong>Idris Calloway:</strong> How did the partners react when they came back?</p>

      <p><strong>Lena Sato:</strong> One of them loved the booths. The other one hated sitting in the middle, and said so, for about a week. Then he stopped mentioning it.</p>

      <p><strong>Idris Calloway:</strong> So not what anyone expected.</p>

      <p><strong>Lena Sato:</strong> In either direction. We lost the big table, and people did miss it. But the stairwell is quiet now.</p>

      <p><strong>Idris Calloway:</strong> Lena Sato, thank you. That''s The Intern Who Redesigned the Office, on The RightUp.</p>'
    format: full_html
