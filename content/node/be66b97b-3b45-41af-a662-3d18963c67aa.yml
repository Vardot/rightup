  field_content:
  - value: '<p>The show is made entirely of work the studio did not ship.</p>

      <p>The institution behind it has been careful not to over-explain, which is either confidence or a way of leaving itself room.</p>

      <p>Priya Raman, the exhibition''s curator, has been close to it from the start.</p>

      <h2>What changed</h2>

      <p>Eighty-one pieces from eleven years of rejected proposals, hung without explanation of which client saw them or why they said no.</p>

      <p>Two of the people who started the project had left by the time it finished, and the handover notes are now part of the studio''s standard kit.</p>

      <p>The empty frames have become the part people photograph.</p>

      <blockquote><p>The work that gets made is the work that survived a meeting. That is not the same as the best work.</p><footer>Raman</footer></blockquote>

      <h2>How it works</h2>

      <p>The studio had to clear each piece with the client who commissioned it. Four refused, and those gaps are hung as empty frames with the year on the wall.</p>

      <p>Attendance will be good. Whether the work is still discussed in a year is the question the institution is quietly asking itself.</p>

      <p>Peers have been generous in public and more pointed in private, mostly about cost.</p>

      <p>What they will not say, on the record, is how close it came to being cancelled in the spring.</p>

      <h2>What happens next</h2>

      <p>It opens on the 14th and runs for six weeks, free.</p>'
    format: full_html
  field_description:
  - value: The show will open the studio's archive of rejected work to the public for the first time.
