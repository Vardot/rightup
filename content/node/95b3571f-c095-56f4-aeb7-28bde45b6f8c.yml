  field_content:
  - value: '<p>Studio Ferri''s Piega lamp starts life as one flat sheet of aluminium and is folded into shape by hand.</p>

      <p>The cable runs through a channel pressed into the stem, and the head tilts on a fold that can be bent back and forth thousands of times.</p>

      <h2>In practice</h2>

      <p>It ships flat, in an envelope.</p>

      <blockquote><p>We wanted the packaging to be thinner than the lamp.</p><footer>Giulia Ferri</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'No screws, no glue: a Milan studio folds its new lamp from one laser-cut blank.'
