      value: |-
        <p><strong>Idris Calloway:</strong> Last Call, I'm Idris Calloway. Priya Nandakumar leads strategy at a branding studio in Bristol that refuses to pitch with a mood board, even when the client asks for one by name. Priya, welcome.</p>
        <p><strong>Priya Nandakumar:</strong> Thanks, Idris. And yes, they do ask by name. It is in about half the briefs we get.</p>
        <p><strong>Idris Calloway:</strong> What is wrong with a mood board?</p>
        <p><strong>Priya Nandakumar:</strong> Nothing, as a private tool. Our designers make them all the time. The problem is showing one. A client picks the three pictures they like, and suddenly those three pictures are the brief. You have handed them a menu before you have agreed what they are hungry for.</p>
        <p><strong>Idris Calloway:</strong> So what do you do instead?</p>
        <p><strong>Priya Nandakumar:</strong> A three-hour intake conversation. We book it before any visual work starts, with the client team and ideally one person who is not in marketing, somebody from operations or customer service. We have a script of about twenty questions, and we record and transcribe it.</p>
        <p><strong>Idris Calloway:</strong> Three hours is a lot of a client's time.</p>
        <p><strong>Priya Nandakumar:</strong> It is, and that is part of the point. If a client cannot find three hours, they will not find the time to make decisions later either. The questions are things like: describe a customer you would be glad to lose, what did your best year feel like inside the building, what word would you ban from your own website.</p>
        <p><strong>Idris Calloway:</strong> And what comes out of it?</p>
        <p><strong>Priya Nandakumar:</strong> A written document, about four pages, that quotes the client back to themselves. Then the first visual work responds to that. When a client sees a typeface, they judge it against their own words, not against a picture of a Scandinavian kitchen.</p>
        <p><strong>Idris Calloway:</strong> The description says it is harder to sell internally than it sounds.</p>
        <p><strong>Priya Nandakumar:</strong> Much harder. Our designers felt it delayed the fun part. And the account team hated it, because a mood board is the easiest thing to put in a pitch. It looks like progress. Telling a procurement panel that you will ask them questions for three hours does not look like progress.</p>
        <p><strong>Idris Calloway:</strong> Have you lost pitches because of it?</p>
        <p><strong>Priya Nandakumar:</strong> At least four that we know of. One client told us outright that the other agency brought pictures and we brought homework. But our first-round approval rate on identity work went from roughly forty percent to seventy-five. Fewer rounds pays for a lot of lost pitches.</p>
        <p><strong>Idris Calloway:</strong> What happens when a client insists?</p>
        <p><strong>Priya Nandakumar:</strong> We show them the transcript and ask which parts they want illustrated. Usually that ends the request.</p>
        <p><strong>Idris Calloway:</strong> Priya Nandakumar, thank you. That is Last Call.</p>
      format: full_html
  field_description:
    -
      value: "Why one branding studio refuses to pitch with a mood board — and what they do instead, even when clients ask for one by name. We talk through the three-hour intake conversation that replaces every deck, and why it's harder to sell internally than it sounds."
