  field_content:
  - value: '<p><strong>Idris Calloway:</strong> This is The RightUp, and I''m Idris Calloway. My guest works at a branding studio that refuses to pitch with a mood board, even when a client asks for one
      by name. Priya Nandakumar leads strategy there. Priya, welcome.</p>

      <p><strong>Priya Nandakumar:</strong> Thanks, Idris. And yes, they do ask by name.</p>

      <p><strong>Idris Calloway:</strong> What''s wrong with a mood board?</p>

      <p><strong>Priya Nandakumar:</strong> Nothing, as a private tool. The problem is showing one. A client picks the three pictures they like, and suddenly those pictures are the brief.</p>

      <p><strong>Idris Calloway:</strong> So what do you do instead?</p>

      <p><strong>Priya Nandakumar:</strong> A three-hour intake conversation. No visuals at all. We ask what the company is afraid of, who they''re quietly jealous of, and what they''d never be caught saying.</p>

      <p><strong>Idris Calloway:</strong> Three hours is a long meeting.</p>

      <p><strong>Priya Nandakumar:</strong> It''s long. But it replaces the deck, the mood board, and usually the first round of revisions too.</p>

      <p><strong>Idris Calloway:</strong> And the hard part?</p>

      <p><strong>Priya Nandakumar:</strong> Honestly, selling it internally. Our own designers want to show something. Walking into a room with nothing to point at feels exposed.</p>

      <p><strong>Idris Calloway:</strong> How do clients respond?</p>

      <p><strong>Priya Nandakumar:</strong> The first hour, a little impatient. By the third, they''re usually the ones talking. That''s when we know we''ve got the real brief.</p>

      <p><strong>Idris Calloway:</strong> Priya Nandakumar, thank you. That''s The Studio That Won''t Use a Mood Board, on The RightUp.</p>'
    format: full_html
  field_description:
  - value: Why one branding studio refuses to pitch with a mood board — and what they do instead, even when clients ask for one by name. We talk through the three-hour intake conversation that replaces
      every deck, and why it's harder to sell internally than it sounds.
