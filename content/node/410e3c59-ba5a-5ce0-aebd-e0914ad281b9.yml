    langcode: en
  field_content:
  - value: '<p>Northfold used to show clients work every Friday. It now holds two reviews per project: one for direction, one for sign-off.</p>

      <p>Between them, the team works without client input and documents every decision.</p>

      <h2>In practice</h2>

      <p>Projects finish eleven days sooner on average, and revision requests have fallen by half.</p>

      <blockquote><p>Weekly reviews were teaching clients to design by committee.</p><footer>Owen Clarke, creative director</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'A Toronto agency moved to two client reviews per project, and timelines got shorter.'
