    -
      value: "<p><strong>Idris Calloway:</strong> I'm Idris Calloway and this is Last Call. Since 2016 one designer has redrawn the same logo every January, for a regional bakery chain of forty shops. Hardly anyone has noticed. Henrik Solberg is that designer. Henrik, who asked you to do this?</p><p><strong>Henrik Solberg:</strong> Nobody, at first. I drew the mark in 2015 for their thirtieth anniversary, a loaf in profile that also reads as a lowercase a. The next winter I saw it printed on a paper bag at a train station kiosk and the counter of the a had filled in completely. It looked like a bun.</p><p><strong>Idris Calloway:</strong> So you fixed it.</p><p><strong>Henrik Solberg:</strong> I opened the counter by about four percent and sent the founder a new file with a one-page note. He paid my invoice for half a day and said, do it again next year if it needs it. That has been the arrangement for ten years. Half a day, one page, every January.</p><p><strong>Idris Calloway:</strong> What has changed in total?</p><p><strong>Henrik Solberg:</strong> The counter is nine percent larger than the original. The stroke at the base of the loaf is lighter by about a fifth, because phone screens render it heavier than paper does. There is a separate version for the oven-proof stickers on their frozen range, which get printed at sixteen millimetres on a thermal printer. That version has almost no detail left.</p><p><strong>Idris Calloway:</strong> And the wordmark?</p><p><strong>Henrik Solberg:</strong> I redrew the r in 2019. The original r had a ball terminal that clogged at small sizes on their receipts. I shortened it. Nobody wrote in. The founder's daughter, who runs it now, said she thought it had always looked like that, which is the best compliment the job can give you.</p><p><strong>Idris Calloway:</strong> How do you stop it drifting into a different logo altogether?</p><p><strong>Henrik Solberg:</strong> I keep every year's version on one sheet of A1, side by side, and I compare the new one to the 2015 drawing, never to last year's. If you only compare to last year you can walk a very long way in small steps.</p><p><strong>Idris Calloway:</strong> Is there a change you made and then undid?</p><p><strong>Henrik Solberg:</strong> In 2021 I tightened the spacing in the wordmark because it looked loose on their app icon. On the shopfronts, eleven metres wide, it looked cramped. I put it back the next January and wrote in the note that I had been wrong.</p><p><strong>Idris Calloway:</strong> What does the client get out of this, honestly?</p><p><strong>Henrik Solberg:</strong> A logo that never needs a rebrand. They have never paid an agency, never had a reveal, never had a week of people complaining online. It costs them less per year than one shop's flour.</p><p><strong>Idris Calloway:</strong> Henrik Solberg, thank you. That's Last Call.</p>"
      format: full_html
