  field_content:
  - value: '<p>The film opens on an empty workshop and stays there for four minutes before anyone speaks.</p>

      <p>Shows like this one tend to be remembered for a single room, and the argument about whether the rest earned it starts on the second weekend.</p>

      <p>Renzo Vidal, the director, who trained under the film''s subject for nine years, has been close to it from the start.</p>

      <h2>What changed</h2>

      <p>Shot over three years on a borrowed 16mm camera, the film follows the workshop through the seasons after its founder''s death, as his apprentices decide what to keep.</p>

      <p>It took three attempts. The first was abandoned at the end of the first month, the second survived until costing, and the third is the one standing.</p>

      <p>The hardest cut, Vidal says, was a nineteen-minute sequence of hands sharpening a chisel.</p>

      <blockquote><p>He talked while he worked. I did not have to write anything.</p><footer>Vidal</footer></blockquote>

      <h2>How it works</h2>

      <p>There is no narration. What explanation exists comes from tape recordings made in the 1990s, which Vidal found in a drawer under the bench.</p>

      <p>The measure will be whether anything changes afterwards, in the collection or the programme, rather than in the press release.</p>

      <p>It has been well received by the audience it was made for and largely ignored by everyone else, which the team says is the outcome they wanted.</p>

      <p>They are careful about what they claim. Two of the decisions that look deliberate now were, by their own account, the only option left by the time anyone noticed.</p>

      <h2>What happens next</h2>

      <p>It screens at three festivals this autumn before a limited run in April.</p>'
