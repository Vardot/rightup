  field_content:
  - value: '<p>Free pitching is getting rarer, and the clients are the ones who blinked first.</p>

      <p>Manufacturing decided most of this, as it usually does. The tooling that survived set the limits, and the design worked inside them.</p>

      <p>Tom James, who surveyed 62 studios and 20 clients, has been close to it from the start.</p>

      <h2>Background</h2>

      <p>Of 62 studios, 38 now charge a pitch fee, up from 9 in 2021. The median fee is enough to cover two weeks of one person''s time.</p>

      <p>The timeline tells its own story: eighteen months from first conversation to the point anyone outside the room saw anything, and then six weeks in which everything visible was decided.</p>

      <p>The studios that still pitch free are mostly the ones competing for the same handful of large accounts.</p>

      <blockquote><p>We stopped asking for five routes when we started paying for them.</p><footer>one client-side marketing director</footer></blockquote>

      <h2>The method</h2>

      <p>Of 20 client-side marketing leads, 14 said a paid pitch made the shortlist shorter and the work better, and four said it made no difference.</p>

      <p>The reissue market rewards fidelity and punishes nostalgia, and the difference between them is usually a single component.</p>

      <p>Reaction has split along predictable lines. The people who have to maintain it have the sharpest questions, and the fairest ones.</p>

      <p>Asked what they would change, the team answers with process rather than product: earlier conversations, fewer assumptions carried over from the last job, and a willingness to lose an argument in
      the first week rather than the last.</p>

      <h2>Where it goes</h2>

      <p>The full data set is published alongside this piece.</p>'
