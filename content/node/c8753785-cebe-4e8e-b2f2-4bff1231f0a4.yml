  field_content:
  - value: '<p>There is nothing hanging. The room is the work, and it is different depending on where you stand in it.</p>

      <p>Shows like this one tend to be remembered for a single room, and the argument about whether the rest earned it starts on the second weekend.</p>

      <p>Priya Nakamura, who went twice, once alone and once at capacity, has been close to it from the start.</p>

      <h2>What changed</h2>

      <p>Projection, shadow and negative space, and a floor plan that deliberately gives no two visitors the same sightline.</p>

      <p>Two of the people who started the project had left by the time it finished, and the handover notes are now part of the studio''s standard kit.</p>

      <p>Go alone and it is an architecture piece. Go at capacity and it is a portrait of the crowd.</p>

      <blockquote><p>The visitors are the only opaque objects in the room. That is the material.</p><footer>the artist</footer></blockquote>

      <h2>How it works</h2>

      <p>The gallery caps entry at eleven people, because at twelve the shadows start to read as bodies rather than as the piece.</p>

      <p>The measure will be whether anything changes afterwards, in the collection or the programme, rather than in the press release.</p>

      <p>Peers have been generous in public and more pointed in private, mostly about cost.</p>

      <p>They are careful about what they claim. Two of the decisions that look deliberate now were, by their own account, the only option left by the time anyone noticed.</p>

      <h2>What happens next</h2>

      <p>Timed entry, eleven at a time, until the end of the season.</p>'
    format: full_html
  field_description:
  - value: An exhibition built entirely from projection, shadow, and negative space — no physical works on display, and no two visitors see quite the same show.
