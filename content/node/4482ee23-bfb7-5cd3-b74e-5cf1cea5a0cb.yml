  field_content:
  - value: '<p>For years every project at Field Office opened with a mood board. Last year the studio dropped them.</p>

      <p>Instead, the lead designer writes one paragraph describing how the finished work should feel, and the team visits the place it will live.</p>

      <h2>In practice</h2>

      <p>The studio says the first round of work is now closer to the final answer.</p>

      <blockquote><p>Pictures of other people''s work kept pulling us toward other people''s answers.</p><footer>Field Office</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'A London studio replaced the mood board with a single written paragraph and a site visit.'
