  field_content:
  - value: '<p>Every panel on the street front came from a building that was coming down within four miles of this one.</p>

      <p>Buildings of this kind are rarely decided by architects alone. A structural engineer, a planning officer and a facilities manager who will never be named in the credits each moved this one several
      metres from where it started, and the drawings record the argument.</p>

      <p>Rena Osei, who followed the salvage for three months, has been close to it from the start.</p>

      <h2>Background</h2>

      <p>The team catalogued 2,100 square metres of cladding from six demolitions, then designed the elevation around what they actually had.</p>

      <p>The timeline tells its own story: eighteen months from first conversation to the point anyone outside the room saw anything, and then six weeks in which everything visible was decided.</p>

      <p>Insurance was the hard part, not construction.</p>

      <blockquote><p>We drew the building twice: once as we wanted it, and once as the skips allowed.</p><footer>the lead architect</footer></blockquote>

      <h2>The method</h2>

      <p>The panels are not matched. Four tones of brick slip sit side by side, and the joint pattern changes where the source changed.</p>

      <p>What stops this being a one-off is the documentation. The practice has published the details, which means the next team does not have to rediscover the same three failures.</p>

      <p>Reaction has split along predictable lines. The people who have to maintain it have the sharpest questions, and the fairest ones.</p>

      <p>There is no shortage of people willing to call it inevitable in hindsight. Nobody involved describes it that way.</p>

      <h2>Where it goes</h2>

      <p>The practice has published its salvage schedule so the next project does not start from nothing.</p>'
