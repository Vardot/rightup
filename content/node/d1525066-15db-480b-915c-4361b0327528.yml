  field_content:
  - value: '<p>Ten years of return visits, the same three villages, the same week of the year, and a slowly changing cast.</p>

      <p>Shows like this one tend to be remembered for a single room, and the argument about whether the rest earned it starts on the second weekend.</p>

      <p>Sana Kovač, who wrote the book''s afterword, has been close to it from the start.</p>

      <h2>What changed</h2>

      <p>The photographs are not arranged by year. They are arranged by colour, so a 2016 procession sits beside one from 2023 because both are carrying the same blue.</p>

      <p>Two of the people who started the project had left by the time it finished, and the handover notes are now part of the studio''s standard kit.</p>

      <p>The decision to sequence by colour cost the book its chronology, which two editors argued against.</p>

      <blockquote><p>I stopped photographing the ceremony and started photographing the return.</p><footer>the photographer</footer></blockquote>

      <h2>How it works</h2>

      <p>The final section prints the same nine people in the same order across a decade, one page per year, with nothing else on the spread.</p>

      <p>The measure will be whether anything changes afterwards, in the collection or the programme, rather than in the press release.</p>

      <p>Peers have been generous in public and more pointed in private, mostly about cost.</p>

      <p>They are careful about what they claim. Two of the decisions that look deliberate now were, by their own account, the only option left by the time anyone noticed.</p>

      <h2>What happens next</h2>

      <p>It is out this month in an edition of 1,500.</p>'
    format: full_html
  field_description:
