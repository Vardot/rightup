  field_content:
  - value: '<p>Atelier Moraes works from a single room in Alfama with one long table and four chairs. The studio has turned away more work this year than it has taken on.</p>

      <p>Founder Lúcia Moraes caps every project at one partner and one designer, and staggers start dates so no two deliverables land in the same week.</p>

      <h2>In practice</h2>

      <p>Clients wait, sometimes for months. Most of them come back.</p>

      <blockquote><p>The table is the business plan. When it is full, we are full.</p><footer>Lúcia Moraes</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'A small practice with a long client list explains why it refuses to grow past one table.'
