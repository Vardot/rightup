  field_content:
  - value: '<p>Studio Okoro has designed restaurants, clinics and two hotels in Lagos without a website, a portfolio PDF or a social account.</p>

      <p>Every commission has come through a former client. Founder Ada Okoro keeps a printed book of finished projects that travels to every first meeting.</p>

      <h2>In practice</h2>

      <p>The studio says the absence keeps the work local and the clients patient.</p>

      <blockquote><p>If someone has to ask a friend about us, they already trust the friend.</p><footer>Ada Okoro</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'The Lagos interiors studio has never had a homepage, and its waiting list runs into next year.'
