  field_content:
  - value: '<p>There are no wall labels. There is no didactic panel by the door. There is a room, and there is neon, and the argument is left to the two of them.</p>

      <p>Shows like this one tend to be remembered for a single room, and the argument about whether the rest earned it starts on the second weekend.</p>

      <p>Priya Nakamura, who spent opening night walking the room with the artist, has been close to it from the start.</p>

      <h2>The decision</h2>

      <p>The installation uses 340 metres of argon and neon tube, bent by hand over eleven weeks, and not one metre of it is switched on at full output.</p>

      <p>Budget was fixed before the brief was finished, which is the wrong order and, everyone involved agrees, the usual one.</p>

      <p>The absence of labels is a decision the gallery has taken heat for, and it is holding.</p>

      <blockquote><p>Light is the only material here that does not need a plinth.</p><footer>the artist</footer></blockquote>

      <h2>In practice</h2>

      <p>The steel is borrowed from a scaffolding contractor and goes back the week the show closes, which is why nothing is welded.</p>

      <p>The measure will be whether anything changes afterwards, in the collection or the programme, rather than in the press release.</p>

      <p>The first week brought the kind of attention nobody plans for, and the second brought the criticism that actually changed something.</p>

      <p>They are careful about what they claim. Two of the decisions that look deliberate now were, by their own account, the only option left by the time anyone noticed.</p>

      <h2>What comes next</h2>

      <p>Open daily until the end of the month. Go late, when the room is dark enough to earn it.</p>'
    format: full_html
  field_description:
  - value: A new exhibition strips away every wall label and didactic panel, letting neon, steel, and shadow argue the point instead. We walked through opening night with the artist behind it.
