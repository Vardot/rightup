  field_content:
  - value: '<p>The depot in Rotterdam-West houses nine studios on one lease. They share a CNC router, a paint booth and a bookkeeper.</p>

      <p>Each studio pays according to floor area, and the workshop is booked through a paper calendar by the door.</p>

      <h2>In practice</h2>

      <p>Two of the studios have started bidding for work together, which none of them could have won alone.</p>

      <blockquote><p>Nobody here could afford the router. Together we can afford two.</p><footer>Femke de Wit, furniture maker</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'Nine small practices split the rent, the tools and the night shifts in a converted tram depot.'
