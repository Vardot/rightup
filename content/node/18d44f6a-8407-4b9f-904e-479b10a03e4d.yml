  field_content:
    -
      value: "<p><strong>Noor Fasi:</strong> I'm Noor Fasi, and this is Small Practice, on The Rightup. In 2022 a brand studio in Gothenburg did something most studios consider reckless. It published its day rates on its website. Annika Berglund is the founder. Annika, welcome.</p><p><strong>Annika Berglund:</strong> Thank you, Noor. Reckless was one of the kinder words used at the time.</p><p><strong>Noor Fasi:</strong> What exactly is on the page?</p><p><strong>Annika Berglund:</strong> Three numbers. Eleven thousand kronor a day for a designer, fourteen thousand for me, and a minimum engagement of ten days. Underneath, a paragraph explaining that we do not discount for exposure and we do not pitch for free.</p><p><strong>Noor Fasi:</strong> What happened the week it went live?</p><p><strong>Annika Berglund:</strong> Enquiries halved. We went from roughly twelve a month to six. For about three weeks I thought I had made a terrible mistake. Then we noticed that all six had a budget, and four of them became work. The year before, we converted about two in twelve.</p><p><strong>Noor Fasi:</strong> So fewer conversations, better ones.</p><p><strong>Annika Berglund:</strong> And much shorter. The first call used to spend twenty minutes circling money. Now it starts at scope, because the client has already done the arithmetic.</p><p><strong>Noor Fasi:</strong> Which clients stopped coming?</p><p><strong>Annika Berglund:</strong> Start-ups before their first funding round, which I miss, because they did the most interesting work. And public sector frameworks, because they want to negotiate a rate down as a matter of procedure and we had published ours as fixed. We lost a municipal wayfinding job over that.</p><p><strong>Noor Fasi:</strong> Did competitors use the numbers against you?</p><p><strong>Annika Berglund:</strong> Two studios in the city quoted just under us on the same tender. We know because the client told us. One of them later called me to say they had put their own rates up after seeing ours. That was a strange phone call.</p><p><strong>Noor Fasi:</strong> Has the published rate changed?</p><p><strong>Annika Berglund:</strong> Twice, by about eight percent each time. We update the page in January and email existing clients a month before. Nobody has left over it, which suggests we were too cheap before.</p><p><strong>Noor Fasi:</strong> Would you recommend it to a younger studio?</p><p><strong>Annika Berglund:</strong> Only if they can survive a quiet quarter. It worked because we had a year of cash in the bank. Publishing rates when you are desperate just advertises the desperation.</p><p><strong>Noor Fasi:</strong> Annika Berglund, thank you. That's Small Practice.</p>"
      format: full_html
