  field_content:
  - value: '<p>Every live project at Studio Brink lives on a single wall of pinboard in the middle of the room.</p>

      <p>Sketches, invoices and client emails go up side by side, and nothing is removed until the job closes.</p>

      <h2>In practice</h2>

      <p>The partners say it replaced three project management tools and a weekly meeting.</p>

      <blockquote><p>If it is not on the wall, it is not happening.</p><footer>Mette Brink, partner</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'Studio Brink pins every live job to one wall and lets nobody take anything down.'
