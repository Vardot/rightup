  field_content:
  - value: '<p>Every part of the Fix kettle comes apart with a single Torx screwdriver, from the element to the switch.</p>

      <p>The company sells each component separately and publishes the wiring diagram on the base.</p>

      <h2>In practice</h2>

      <p>Early buyers have already replaced lids and switches at home, and the company says that was the point.</p>

      <blockquote><p>A kettle should outlive the warranty by twenty years.</p><footer>Jonas Brandt, product lead</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'A Berlin start-up publishes the parts list and sells every component on its own.'
