  field_content:
  - value: '<p>Fifty years on, a short handbook on grids is still the first thing handed to a new hire in more studios than any other book.</p>

      <p>The system has to survive people who do not care about it. That is the actual test, and it happens in procurement, in email signatures and on signage nobody briefed.</p>

      <p>Tomas Adeyemi, who asked forty studios what they give a junior on day one, has been close to it from the start.</p>

      <h2>What changed</h2>

      <p>Ninety-one pages, no case studies, and a fold-out that most owners have never unfolded because the binding will not survive it.</p>

      <p>The timeline tells its own story: eighteen months from first conversation to the point anyone outside the room saw anything, and then six weeks in which everything visible was decided.</p>

      <p>Its survival is partly an accident of format: it fits in a coat pocket, which is where most copies have lived.</p>

      <blockquote><p>It is the only book I have that assumes you are going to make something on Monday.</p><footer>one design director</footer></blockquote>

      <h2>How it works</h2>

      <p>The book has never been substantially revised. The 1998 reprint corrected two typographic errors and left the rest.</p>

      <p>The system survives or fails on its worst application, not its best, and nobody presents that slide.</p>

      <p>Reaction has split along predictable lines. The people who have to maintain it have the sharpest questions, and the fairest ones.</p>

      <p>There is no shortage of people willing to call it inevitable in hindsight. Nobody involved describes it that way.</p>

      <h2>What happens next</h2>

      <p>It is still in print, and still costs less than a decent notebook.</p>'
