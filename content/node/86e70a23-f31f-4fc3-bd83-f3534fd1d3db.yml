    langcode: en
  field_content:
  - value: '<p>Three scrapped directions, one change of chief executive, and a mark that survived because a single engineer liked it on a tail fin mock-up.</p>

      <p>Identity work is judged twice: once in the room where it is presented, and once, much later, by people who never saw the presentation and have no idea a decision was made.</p>

      <p>Sana Kovač, who was given access to the project files, has been close to it from the start.</p>

      <h2>The decision</h2>

      <p>The studio presented in year one, year two and year four. The mark that shipped is closest to the year-one work, redrawn at a different weight.</p>

      <p>Budget was fixed before the brief was finished, which is the wrong order and, everyone involved agrees, the usual one.</p>

      <p>The internal politics, not the design, is the story here, and both sides now agree on that.</p>

      <blockquote><p>Nothing was wrong with the first route. There was simply nobody left in the room who had approved it.</p><footer>one person close to the project</footer></blockquote>

      <h2>In practice</h2>

      <p>The delay cost the airline a repaint cycle, which means fourteen aircraft flew for two years in a livery nobody intended to keep.</p>

      <p>The work will be judged on the boring surfaces: the app, the boarding pass, the sign above a desk in a regional office. That is where identities actually live.</p>

      <p>The first week brought the kind of attention nobody plans for, and the second brought the criticism that actually changed something.</p>

      <p>They are careful about what they claim. Two of the decisions that look deliberate now were, by their own account, the only option left by the time anyone noticed.</p>

      <h2>What comes next</h2>

      <p>The full identity lands next month, four years and one chief executive later.</p>'
    format: full_html
  field_description:
  - value: Arclight Studio walks through the internal politics, three scrapped directions, and the one executive who almost killed the project entirely before it shipped.
