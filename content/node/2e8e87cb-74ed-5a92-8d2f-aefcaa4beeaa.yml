  field_content:
  - value: '<p>Taller Vega was founded in 1998 by a cabinetmaker and an architect. Today all five partners joined as apprentices.</p>

      <p>The studio pays apprentices from the first day and rotates them through drawing, joinery and site work before they choose a direction.</p>

      <h2>In practice</h2>

      <p>The founders retired last year, and the handover took a single afternoon.</p>

      <blockquote><p>The bench teaches you what the drawing cannot.</p><footer>Mariana Vega, partner</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'Taller Vega hands every partnership to someone who started at the bench.'
