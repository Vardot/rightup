  field_content:
  - value: '<p>Holm Audio sold its first portable radio in 1968. The reissue keeps the walnut case, the cloth grille and the hand-lettered dial.</p>

      <p>Inside is a digital receiver with a battery that lasts a week.</p>

      <h2>In practice</h2>

      <p>The company says the old dial is not nostalgia: people find stations faster when they can see them.</p>

      <blockquote><p>The dial is a map. A screen is a list.</p><footer>Signe Holm, design director</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'The reissue keeps the walnut case and the dial, and hides a modern receiver behind both.'
