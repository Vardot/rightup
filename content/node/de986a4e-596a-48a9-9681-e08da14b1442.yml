  field_content:
    -
      value: "<p><strong>Beatriz Solano:</strong> This is Office Hours with me, Beatriz Solano. Should a young designer specialise early? I have two people who answered that question in opposite ways. Ayesha Qureshi does wayfinding and nothing else, mostly hospitals and transport hubs. Callum Whitfield runs a small studio in Glasgow that does books, websites, exhibitions and once, memorably, a ferry.</p><p><strong>Callum Whitfield:</strong> The livery and the menus. It was a good year.</p><p><strong>Beatriz Solano:</strong> Ayesha, did you plan to specialise?</p><p><strong>Ayesha Qureshi:</strong> Not at all. I did signage for one hospital in Birmingham as a junior, and two years later the people who build hospitals were phoning me by name. Specialising happened to me. What I did choose was to say yes to the second call and no to a cosmetics brand the same month.</p><p><strong>Beatriz Solano:</strong> What did that give you?</p><p><strong>Ayesha Qureshi:</strong> Depth you cannot get otherwise. I know that a corridor sign in a ward needs to be readable at nine metres by someone on morphine. I know the infection control rules on which surfaces can be wiped. Clients pay for that knowledge, and my day rate is about forty percent higher than it would be as a generalist.</p><p><strong>Callum Whitfield:</strong> And you lose variety, which for me is the whole point. Every project teaches something the next one uses. The ferry taught me about marine paint and how type behaves on a curved hull. That ended up in an exhibition about shipbuilding two years later.</p><p><strong>Beatriz Solano:</strong> Callum, what does a generalist give up?</p><p><strong>Callum Whitfield:</strong> Pricing power, definitely. When we pitch against a specialist, we often lose on credibility in the first ten minutes. And the admin is relentless. Every new sector means new suppliers, new printers, new jargon.</p><p><strong>Ayesha Qureshi:</strong> The risk on my side is a market turning. During the pandemic, two of my airport projects stopped in one week. If hospitals had not been building, I would have had no work at all.</p><p><strong>Beatriz Solano:</strong> So what would you each tell a graduate?</p><p><strong>Ayesha Qureshi:</strong> Do not pick a specialism at twenty-two. Notice where you are more useful than other people, after about three years, and follow that.</p><p><strong>Callum Whitfield:</strong> I'd say stay broad until your work starts to repeat. When you catch yourself solving the same problem a third time, that is either a specialism or a sign to move on.</p><p><strong>Ayesha Qureshi:</strong> And learn the boring regulations of whatever you do. That is where the expertise really lives.</p><p><strong>Callum Whitfield:</strong> On that, we agree completely.</p><p><strong>Beatriz Solano:</strong> Ayesha Qureshi, Callum Whitfield, thank you. You've been listening to Office Hours.</p>"
      format: full_html
  field_description:
    -
      value: 'Whether a young designer should pick one thing early, argued by a generalist and a specialist.'
