    langcode: en
  field_content:
  - value: '<p>Halden & Roe spent a decade in a fourth-floor loft above a shoe shop. This spring the twenty-two person studio moved its desks, its model shop and its archive into a ferry terminal that had stood empty since the crossing was cancelled.</p>

      <p>The building is a single timber shed with a mezzanine along one side. The studio kept the departure boards and now uses them to post deadlines.</p>

      <h2>In practice</h2>

      <p>The model shop sits where the ticket hall used to be, so the noise stays on the ground floor and the drawing desks get the light from the water.</p>

      <blockquote><p>We wanted a room where everyone can see what everyone else is making.</p><footer>Ingrid Halden, co-founder</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'The Oslo practice traded a city-centre loft for a timber shed on the water, and kept the departure boards.'
