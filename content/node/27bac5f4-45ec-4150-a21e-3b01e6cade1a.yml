  field_content:
  - value: '<p>Each episode holds a single frame for a full minute before anything moves.</p>

      <p>The institution behind it has been careful not to over-explain, which is either confidence or a way of leaving itself room.</p>

      <p>Priya Nakamura, who watched all six episodes, has been close to it from the start.</p>

      <h2>The decision</h2>

      <p>The camera never pans. When the work leaves the frame, the frame waits, and the sound carries what you cannot see.</p>

      <p>Budget was fixed before the brief was finished, which is the wrong order and, everyone involved agrees, the usual one.</p>

      <p>Viewers report the opposite of boredom, which the makers did not expect and cannot fully explain.</p>

      <blockquote><p>We are asking for a minute of attention before we earn it. Most people give us forty seconds.</p><footer>the series director</footer></blockquote>

      <h2>In practice</h2>

      <p>Six episodes, six trades, and no interviews: the only voices are the ones that happen to be in the room.</p>

      <p>Attendance will be good. Whether the work is still discussed in a year is the question the institution is quietly asking itself.</p>

      <p>The first week brought the kind of attention nobody plans for, and the second brought the criticism that actually changed something.</p>

      <p>They are careful about what they claim. Two of the decisions that look deliberate now were, by their own account, the only option left by the time anyone noticed.</p>

      <h2>What comes next</h2>

      <p>All six are streaming now, and the first is the one to start with.</p>'
    format: full_html
  field_description:
