      value: "<p><strong>Idris Calloway:</strong> You are listening to Last Call, and I'm Idris Calloway. A regional health service rebuilt its online appointment booking with a product owner who is blind. Samuel Adeyemi is that product owner. With him is Hannah Ferreira, the lead designer on the team. Samuel, what had the team been getting wrong before you arrived?</p><p><strong>Samuel Adeyemi:</strong> They tested with a screen reader at the very end, in an accessibility audit two weeks before launch. That is like checking the foundations after the roof is on. The audit found about two hundred issues, they fixed the forty marked critical, and shipped.</p><p><strong>Idris Calloway:</strong> Ruth, did it feel like that from the inside?</p><p><strong>Hannah Ferreira:</strong> Honestly, it felt like we were doing well. We had contrast ratios on every colour and alt text on every image. We thought accessibility was a checklist and we had ticked it.</p><p><strong>Idris Calloway:</strong> Samuel, what changed first?</p><p><strong>Samuel Adeyemi:</strong> Every design review started with me using the thing aloud, on the big screen, with my screen reader at the speed I normally use, which is fast. Everyone in the room heard what I heard. The first week, booking a blood test took me eleven minutes and two phone calls to my sister.</p><p><strong>Hannah Ferreira:</strong> That review was very quiet. Nobody defended anything.</p><p><strong>Idris Calloway:</strong> What do sighted designers miss most?</p><p><strong>Samuel Adeyemi:</strong> Order. You see a page all at once. I hear it one item at a time, top to bottom. The old form put the appointment date picker above the explanation of which clinics were open, so I had to pick a date before I knew whether it was possible. Sighted users skipped down and back up without noticing they were doing it.</p><p><strong>Idris Calloway:</strong> What did you change in the booking itself?</p><p><strong>Hannah Ferreira:</strong> We dropped the calendar grid entirely. It became a list: the next five available slots, in plain sentences, with the clinic and the bus route in each one. It tested better with every group, including people booking on their phone at a bus stop.</p><p><strong>Idris Calloway:</strong> Numbers?</p><p><strong>Samuel Adeyemi:</strong> Phone bookings went down about a fifth in the first quarter. Complaints about the online service halved. And booking a blood test now takes me ninety seconds.</p><p><strong>Idris Calloway:</strong> Ruth, what would you tell a team starting now?</p><p><strong>Hannah Ferreira:</strong> Hire the person, do not just consult them. A consultant visits. Samuel is in every standup, and he has a veto.</p><p><strong>Idris Calloway:</strong> Samuel Adeyemi and Hannah Ferreira, thank you. This has been Last Call.</p>"
      format: full_html
