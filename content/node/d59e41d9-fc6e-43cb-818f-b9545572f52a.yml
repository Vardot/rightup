    langcode: en
  field_content:
  - value: '<p>For one weekend the model shop became a gallery, and the models were moved to the floor to make room for other people''s work.</p>

      <p>Shows like this one tend to be remembered for a single room, and the argument about whether the rest earned it starts on the second weekend.</p>

      <p>Ana Sood, one of four ceramicists invited, has been close to it from the start.</p>

      <h2>Background</h2>

      <p>The studio gave the ceramicists the space, the lighting rig and a budget for plinths, and took no cut of sales.</p>

      <p>It took three attempts. The first was abandoned at the end of the first month, the second survived until costing, and the third is the one standing.</p>

      <p>By Sunday afternoon eleven of the nineteen pieces had gone.</p>

      <blockquote><p>They handed us the keys and left. That is rarer than it should be.</p><footer>Sood</footer></blockquote>

      <h2>The method</h2>

      <p>Nothing was labelled. Prices were written on a single sheet by the door, which is also where the till was.</p>

      <p>The measure will be whether anything changes afterwards, in the collection or the programme, rather than in the press release.</p>

      <p>It has been well received by the audience it was made for and largely ignored by everyone else, which the team says is the outcome they wanted.</p>

      <p>What they will not say, on the record, is how close it came to being cancelled in the spring.</p>

      <h2>Where it goes</h2>

      <p>The studio says it will do it again in spring, with glassmakers.</p>'
    format: full_html
  field_description:
  - value: For one weekend, the studio's model shop became a gallery for five ceramicists from the neighbourhood.
