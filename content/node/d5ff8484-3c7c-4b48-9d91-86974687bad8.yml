  field_content:
  - value: '<p><strong>Idris Calloway:</strong> This is The RightUp, and I''m Idris Calloway. For three years, one studio hasn''t opened a computer in a client presentation. Not once. And they keep winning
      work. Hana Ruiz is a founding partner there. Hana, welcome.</p>

      <p><strong>Hana Ruiz:</strong> Thanks, Idris. Three years and two months, if we''re being precise.</p>

      <p><strong>Idris Calloway:</strong> So what''s in the room instead?</p>

      <p><strong>Hana Ruiz:</strong> Physical models, hand-drawn diagrams, and paper. Lots of paper. We pin the thinking to the wall before the client arrives.</p>

      <p><strong>Idris Calloway:</strong> And no laptops at all?</p>

      <p><strong>Hana Ruiz:</strong> None. Not ours, and we politely ask the client team as well. It started as an experiment. Now clients come in expecting it.</p>

      <p><strong>Idris Calloway:</strong> Doesn''t that make it harder to show detail?</p>

      <p><strong>Hana Ruiz:</strong> It makes us choose. If an idea needs forty screens to explain, it usually isn''t ready. A model on the table gets touched, turned around, argued over. A slide gets nodded
      at.</p>

      <p><strong>Idris Calloway:</strong> What was the hardest part of the switch?</p>

      <p><strong>Hana Ruiz:</strong> The first month. A model takes three days to build, and a slide takes twenty minutes. We had to learn to decide earlier.</p>

      <p><strong>Idris Calloway:</strong> Has a client ever asked for a presentation file afterwards?</p>

      <p><strong>Hana Ruiz:</strong> Often. We photograph the wall and send that. It''s the most honest record of the meeting we have.</p>

      <p><strong>Idris Calloway:</strong> Hana Ruiz, thank you. That''s Three Years Without a Deck, on The RightUp.</p>'
    format: full_html
  field_description:
  - value: Inside the studio that hasn't touched a computer for client presentations in three years, and how they've kept winning work without one. Physical models, hand-drawn diagrams, and a strict no-laptops-in-the-room
      policy that clients have come to expect.
