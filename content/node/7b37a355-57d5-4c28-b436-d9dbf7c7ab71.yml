  field_content:
    -
      value: "<p><strong>Kenji Arakawa:</strong> Material World, I'm Kenji Arakawa. We are in Brittany, on the edge of a field of three-metre-tall hemp, with Clementine Arsenault, who grows it, processes it and then builds with it. Clementine, you have strong feelings about why this plant disappeared.</p><p><strong>Clementine Arsenault:</strong> I do. Industrial hemp was lumped together with cannabis by drug law, but it has almost none of the psychoactive compound, less than point three percent. It was banned in many countries for decades because of what it looks like, not what it does. France never fully stopped, which is why we still have the processing plants.</p><p><strong>Kenji Arakawa:</strong> What happens after you cut it?</p><p><strong>Clementine Arsenault:</strong> We leave the stalks on the field for two or three weeks to ret, which loosens the fibre from the woody core. Then a decorticator separates them. The long fibre goes to insulation batts and textiles. The woody core, cut into pieces of around fifteen millimetres, is called hurd or shiv. That is what goes into hempcrete.</p><p><strong>Kenji Arakawa:</strong> And hempcrete is shiv plus what?</p><p><strong>Clementine Arsenault:</strong> A lime binder and water. Roughly one part binder to two of shiv by weight. We cast it around a timber frame, three hundred millimetres thick, and tamp it lightly. Not hard, like rammed earth. You want the air left in it, because air is the insulation.</p><p><strong>Kenji Arakawa:</strong> So it is not structural.</p><p><strong>Clementine Arsenault:</strong> Not at all. It is a wall that insulates, regulates humidity and stores some heat, around a frame that carries the load. People get that wrong and expect it to hold up a roof. It has about a twentieth of the compressive strength of concrete.</p><p><strong>Kenji Arakawa:</strong> How does it perform as insulation?</p><p><strong>Clementine Arsenault:</strong> A thermal conductivity around point zero seven. Mineral wool is closer to point zero four, so you need a thicker wall for the same number. But hempcrete buffers moisture and has mass, so the house feels more even than the figure suggests. And while it grows, the crop takes up more carbon than the lime releases.</p><p><strong>Kenji Arakawa:</strong> What is the catch?</p><p><strong>Clementine Arsenault:</strong> Drying time. A thirty centimetre wall needs six to eight weeks of good weather before you can render it. We had a school extension in Rennes where the contractor tried to plaster after three weeks and trapped the water. We cut it back and started again.</p><p><strong>Kenji Arakawa:</strong> How much hemp is needed for a house?</p><p><strong>Clementine Arsenault:</strong> A small three-bedroom house uses around four hectares of crop. One harvest, about a hundred and twenty days from sowing.</p><p><strong>Kenji Arakawa:</strong> Clementine Arsenault, thank you. That is Hemp, on Material World.</p>"
      format: full_html
