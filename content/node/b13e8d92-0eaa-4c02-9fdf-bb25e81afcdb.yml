  field_content:
    -
      value: "<p><strong>Tamsin Achari:</strong> You are listening to The Long Table, recorded on the upper floor of the old print works during design week. I'm Tamsin Achari. Tonight: clients, strategists and designers arguing about who gets to change the question. Rosalind Achebe is a strategy director who has written briefs for a national rail operator and two banks. Gideon Mwangi is head of marketing at a chain of forty-one pharmacies, and he commissions design for a living. Rosalind, who owns the brief?</p><p><strong>Rosalind Achebe:</strong> The client owns the problem. The moment they hand you a solution and call it a brief, you are allowed to hand it back. Redesign our logo is not a brief. Fewer people under thirty come into our shops is a brief.</p><p><strong>Gideon Mwangi:</strong> I agree, which I am told rather spoils the argument you had planned.</p><p><strong>Tamsin Achari:</strong> It does. Gideon, try to disagree a little.</p><p><strong>Gideon Mwangi:</strong> Fine. Here is where it gets hard. I do not walk into the agency with a blank page. By the time I brief anyone, my finance director has signed off a number, my chief executive has an opinion about the colour green, and our legal team has a list of words we cannot use. I own a problem with a lot of fences around it. If a designer tells me the real problem is something else entirely, I may agree, and still be unable to buy that answer.</p><p><strong>Rosalind Achebe:</strong> Then say so in the brief. The worst briefs are the ones that hide the fences. If I know the budget is two hundred thousand and the green is non-negotiable, I can work. If I find out in week six, everyone has wasted a month.</p><p><strong>Tamsin Achari:</strong> Somebody in the second row just said yes, out loud.</p><p><strong>Gideon Mwangi:</strong> The pharmacy project last year is a good example. We briefed a new shop format. The studio came back after two weeks and said the real issue was the queue at the prescription counter, which was where people decided never to come back. They were right. We spent the money on the counter and the waiting system, not the shopfront.</p><p><strong>Tamsin Achari:</strong> So the designers changed the question and you let them.</p><p><strong>Gideon Mwangi:</strong> Because they came with evidence. They had sat in four branches with a stopwatch. Average wait, eleven minutes. That number did more than any presentation.</p><p><strong>Rosalind Achebe:</strong> That is the rule. You can change the question, but you have to earn it with something the client cannot argue with.</p><p><strong>Tamsin Achari:</strong> Last word. One thing every brief should contain that most do not.</p><p><strong>Rosalind Achebe:</strong> What happens if we do nothing.</p><p><strong>Gideon Mwangi:</strong> The name of the person who can actually say yes.</p><p><strong>Tamsin Achari:</strong> Rosalind Achebe and Gideon Mwangi, thank you. This has been The Long Table.</p>"
