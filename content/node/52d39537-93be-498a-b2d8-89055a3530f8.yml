  - alias: /news/why-more-studios-are-sketching-hand-again
    langcode: en
  field_content:
  - value: '<p>The first hour of a project, in five of the studios we spoke to, now happens without a screen in the room.</p>

      <p>Process stories are easy to romanticise. The studios worth listening to describe theirs in terms of what it costs them, not what it saves.</p>

      <p>Sana Kovač, who visited eleven studios for this piece, has been close to it from the start.</p>

      <h2>Background</h2>

      <p>The argument is not nostalgia. It is speed of disagreement: a pencil drawing can be argued with before anyone has invested an afternoon in rendering it.</p>

      <p>The timeline tells its own story: eighteen months from first conversation to the point anyone outside the room saw anything, and then six weeks in which everything visible was decided.</p>

      <p>Not everyone is convinced, and the objection is a fair one: hand drawing privileges whoever draws best.</p>

      <blockquote><p>You cannot fall in love with a sketch. That is the point of it.</p><footer>one studio founder</footer></blockquote>

      <h2>The method</h2>

      <p>Three of the studios have gone further and banned laptops from the first client meeting, after finding that a visible screen turns a conversation into a review.</p>

      <p>None of this scales cleanly. Ask any of them to run it across forty people and they go quiet.</p>

      <p>Reaction has split along predictable lines. The people who have to maintain it have the sharpest questions, and the fairest ones.</p>

      <p>They are careful about what they claim. Two of the decisions that look deliberate now were, by their own account, the only option left by the time anyone noticed.</p>

      <h2>Where it goes</h2>

      <p>The compromise most have landed on is an hour, not a week.</p>'
    format: full_html
  field_description:
  - value: Founders say the first hour of a project goes better with a pencil than with a screen, and clients have started to notice.
