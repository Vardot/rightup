  field_content:
  - value: '<p>Five founders, five different opening questions, and one they all ask before anyone opens a laptop.</p>

      <p>Process stories are easy to romanticise. The studios worth listening to describe theirs in terms of what it costs them, not what it saves.</p>

      <p>Tom James, who sat in on four of the meetings, has been close to it from the start.</p>

      <h2>What changed</h2>

      <p>The shared question is some version of who has to live with this after we leave, and the answer decides how the rest of the hour goes.</p>

      <p>Budget was fixed before the brief was finished, which is the wrong order and, everyone involved agrees, the usual one.</p>

      <p>The red flag is unanimous: a client who cannot name the person who will own the work.</p>

      <blockquote><p>If I am writing, I am not listening, and they can tell.</p><footer>one founder</footer></blockquote>

      <h2>How it works</h2>

      <p>Four of the five take no notes in the first thirty minutes. One records, with permission, and sends the transcript back the same day.</p>

      <p>None of this scales cleanly. Ask any of them to run it across forty people and they go quiet.</p>

      <p>The first week brought the kind of attention nobody plans for, and the second brought the criticism that actually changed something.</p>

      <p>Asked what they would change, the team answers with process rather than product: earlier conversations, fewer assumptions carried over from the last job, and a willingness to lose an argument in
      the first week rather than the last.</p>

      <h2>What happens next</h2>

      <p>Every one of them has walked away from a project for that reason in the last two years.</p>'
    format: full_html
