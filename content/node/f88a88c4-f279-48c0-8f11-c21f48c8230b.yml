  field_content:
    -
      value: |-
        <p><strong>Idris Calloway:</strong> You are listening to Last Call, and I'm Idris Calloway. My guest designed a museum wing with no straight walls anywhere in it. The client said yes on the first pass. The contractor's framing crew had never built a curve. Elias Brandt, welcome.</p>
        <p><strong>Elias Brandt:</strong> Thanks for having me, Idris.</p>
        <p><strong>Idris Calloway:</strong> Why no straight walls?</p>
        <p><strong>Elias Brandt:</strong> The collection is mostly twentieth-century sculpture, about ninety pieces. Straight walls turn a gallery into a corridor you walk past things in. A curve slows you down, it makes you walk around the work and see the back of it.</p>
        <p><strong>Idris Calloway:</strong> And the client agreed straight away?</p>
        <p><strong>Elias Brandt:</strong> At the first presentation, which never happens. The director had worked in a museum in Aarhus with one curved room and said it was the only room people lingered in. The board approved it the same month.</p>
        <p><strong>Idris Calloway:</strong> So where did it go wrong?</p>
        <p><strong>Elias Brandt:</strong> On site. The walls are lightweight steel stud with two layers of plasterboard, set out on radii between four and eleven metres. The framing crew were very good, but they had only ever framed straight runs. On the first gallery they set the studs out by eye from the drawings, at the normal six-hundred centres. Plasterboard will not bend to a four-metre radius at that spacing, it cracks. We had about thirty metres of wall that had to come down.</p>
        <p><strong>Idris Calloway:</strong> How did you find out?</p>
        <p><strong>Elias Brandt:</strong> The site manager sent me a photo of a crack you could fit a coin in. I was there by the afternoon.</p>
        <p><strong>Idris Calloway:</strong> What was the fix?</p>
        <p><strong>Elias Brandt:</strong> Two things. We reduced the stud spacing to three hundred on the tight curves and specified a thinner, flexible board, wetted before fixing. And we made a set of plywood templates, one for each radius, cut on a CNC router, so the crew could set out the track on the floor without reading curves off a drawing. The second part was the real fix.</p>
        <p><strong>Idris Calloway:</strong> The description mentions a redrawn foundation plan.</p>
        <p><strong>Elias Brandt:</strong> Yes, and that part still makes me wince. The tighter studs and the heavier board put more load on the slab edge where two galleries meet. The engineer checked it and we had to add a thickened strip of foundation along about eighteen metres. Redrawing that plan, getting it approved and pouring it cost three weeks.</p>
        <p><strong>Idris Calloway:</strong> Who paid?</p>
        <p><strong>Elias Brandt:</strong> It was split. We should have specified the stud spacing, and we said so.</p>
        <p><strong>Idris Calloway:</strong> Would you design it the same way again?</p>
        <p><strong>Elias Brandt:</strong> Yes. But I would build one curved wall in a yard before the contract starts.</p>
        <p><strong>Idris Calloway:</strong> Elias Brandt, thank you. That is Last Call.</p>
      format: full_html
  field_description:
    -
      value: "An architect on designing a museum wing with no straight walls, why the client said yes on the first pass, and what almost went wrong in construction when the contractor's crew had never framed a curve before. The fix cost three weeks and a redrawn foundation plan."
