  field_content:
  - value: '<p><strong>Noor Fasi:</strong> This is The RightUp. I''m Noor Fasi. My guest designed a museum wing with no straight walls anywhere in it. The client said yes on the first pass. Construction
      was another story. Elias Brandt, welcome.</p>

      <p><strong>Elias Brandt:</strong> Thanks for having me, Noor.</p>

      <p><strong>Noor Fasi:</strong> Why no straight walls?</p>

      <p><strong>Elias Brandt:</strong> The collection is mostly sculpture. Straight walls make a room feel like a corridor you walk past things in. Curves slow you down. They make you walk around the work.</p>

      <p><strong>Noor Fasi:</strong> And the client agreed straight away?</p>

      <p><strong>Elias Brandt:</strong> On the first presentation. Which, honestly, worried me more than a no would have.</p>

      <p><strong>Noor Fasi:</strong> So what almost went wrong?</p>

      <p><strong>Elias Brandt:</strong> The contractor''s framing crew had never built a curve. Not once. Their first wall was set out as a series of short straight segments, and from the gallery floor
      you could see every joint.</p>

      <p><strong>Noor Fasi:</strong> How did you find out?</p>

      <p><strong>Elias Brandt:</strong> I walked in on a Tuesday and the light was catching every corner that shouldn''t have been there. We stopped work that afternoon.</p>

      <p><strong>Noor Fasi:</strong> And the fix?</p>

      <p><strong>Elias Brandt:</strong> Three weeks, and a redrawn foundation plan. We changed how the base plate was set out, so the curve was built in from the ground rather than bent in afterwards. The
      crew turned out to be excellent once they could see what we meant.</p>

      <p><strong>Noor Fasi:</strong> Elias Brandt, thank you. That''s No Straight Walls, on The RightUp.</p>'
    format: full_html
  field_description:
  - value: An architect on designing a museum wing with no straight walls, why the client said yes on the first pass, and what almost went wrong in construction when the contractor's crew had never framed
      a curve before. The fix cost three weeks and a redrawn foundation plan.
