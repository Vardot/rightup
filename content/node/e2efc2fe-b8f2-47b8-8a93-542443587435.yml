  field_content:
    -
      value: "<p><strong>Malik Osei:</strong> This is Field Notes, I'm Malik Osei, and I've just been told to put on cotton gloves before I'm allowed through the door. We're in a basement under a school of architecture where sixty years of models are kept at eighteen degrees and fifty percent humidity. It's dim, the shelves go back further than the light does, and the only sound is the air handling. Estelle Varga is one of the two conservators here.</p><p><strong>Estelle Varga:</strong> Welcome. Mind the step. And please don't lean on anything, some of these shelves hold things that weigh less than a sandwich and are worth a lot more.</p><p><strong>Malik Osei:</strong> How many models are down here?</p><p><strong>Estelle Varga:</strong> About two thousand four hundred, catalogued. The oldest is from 1961, a competition entry for a concert hall that was never built. The newest came in last month. Every year the school gives us the best ten graduation models, and every few years an alumnus dies and their family gives us an office's worth.</p><p><strong>Malik Osei:</strong> Which materials age worst?</p><p><strong>Estelle Varga:</strong> Foam, without question. Anything from the late eighties and nineties made in polystyrene foam is slowly turning to powder. It yellows, gets brittle and then starts to slump. The balsa and limewood from the fifties and sixties are almost perfect. Card is fine if it was good card. The glues are the real problem. Contact adhesives from the seventies let go, and you come in one morning and a roof is on the floor.</p><p><strong>Malik Osei:</strong> We're at a bench now with a model of a housing estate under a magnifier.</p><p><strong>Estelle Varga:</strong> This is my colleague Ruben's project this month. Six hundred tiny houses, each one a block of jelutong about a centimetre long, and about a fifth of them have come loose from the base. He's reattaching them with a reversible adhesive, one by one, from the original photographs, so they go back in exactly the right place.</p><p><strong>Malik Osei:</strong> Reversible?</p><p><strong>Estelle Varga:</strong> Everything we add must come off again without damage. If somebody in fifty years has a better method, they should be able to undo us.</p><p><strong>Malik Osei:</strong> Do you ever rebuild a model that's too far gone?</p><p><strong>Estelle Varga:</strong> No. We stabilise. We'd rather keep a broken original than make a perfect copy. If I rebuild a model, it stops being the thing the architect made with their own hands and starts being mine. Where a piece is missing, we leave the gap and we document it.</p><p><strong>Malik Osei:</strong> Who comes down here to see them?</p><p><strong>Estelle Varga:</strong> Students, mostly, about four hundred visits a year. Some researchers. And occasionally an architect who wants to see their own student model, which is always a strange afternoon for everybody.</p><p><strong>Malik Osei:</strong> Estelle Varga, thank you. From the model archive, this has been Field Notes.</p>"
      format: full_html
