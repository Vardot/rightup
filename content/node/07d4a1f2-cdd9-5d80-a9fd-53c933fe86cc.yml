  field_content:
  - value: '<p>Earth & Ash''s new range is fired at around 600 degrees, half the temperature of conventional stoneware.</p>

      <p>The studio spent two years on a clay body that stays dense at the lower heat.</p>

      <h2>In practice</h2>

      <p>The plates are slightly thicker than usual, which the studio has chosen to show rather than hide.</p>

      <blockquote><p>Thicker is honest. It tells you how it was made.</p><footer>Hannah Price, ceramicist</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'A ceramic studio in Stoke cuts its kiln energy without losing strength.'
