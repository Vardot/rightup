  field_content:
  - value: '<p>Every glyph in the family begins as a stack of translucent rectangles, rotated until the overlaps make a letter.</p>

      <p>The system has to survive people who do not care about it. That is the actual test, and it happens in procurement, in email signatures and on signage nobody briefed.</p>

      <p>Rena Osei, who drew the family over fourteen months, has been close to it from the start.</p>

      <h2>Background</h2>

      <p>The method produces counters that no interpolation would give you: the lowercase g has a bowl that is slightly heavier on the left because two shapes cross there.</p>

      <p>It took three attempts. The first was abandoned at the end of the first month, the second survived until costing, and the third is the one standing.</p>

      <p>The foundry has released the construction file alongside the fonts.</p>

      <blockquote><p>I stopped drawing letters and started drawing the collisions.</p><footer>Osei</footer></blockquote>

      <h2>The method</h2>

      <p>It ships in five weights, and the lightest exists only because the overlap rule broke at that size and the studio liked what it did instead.</p>

      <p>The system survives or fails on its worst application, not its best, and nobody presents that slide.</p>

      <p>It has been well received by the audience it was made for and largely ignored by everyone else, which the team says is the outcome they wanted.</p>

      <p>There is no shortage of people willing to call it inevitable in hindsight. Nobody involved describes it that way.</p>

      <h2>Where it goes</h2>

      <p>Licences start at thirty euros. The construction file is free.</p>'
