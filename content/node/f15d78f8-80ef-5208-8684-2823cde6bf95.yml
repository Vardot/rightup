  - alias: /news/why-kessler-lund-publishes-every-rejected-proposal
    langcode: en
  field_content:
  - value: '<p>Kessler Lund has published forty-one rejected proposals since 2022, each with the brief, the fee and a short note on why the client said no.</p>

      <p>The archive started as an internal exercise. A junior designer suggested putting it on the website, and the partners agreed on the condition that clients were asked first.</p>

      <h2>In practice</h2>

      <p>Only two clients refused. The rest, the studio says, were curious to see how they had been read.</p>

      <blockquote><p>People hire you for how you think. The losing work shows that better than the winning work.</p><footer>Anders Kessler, partner</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'The Copenhagen studio puts its losing pitches online, budgets included, and says it wins more work because of it.'
