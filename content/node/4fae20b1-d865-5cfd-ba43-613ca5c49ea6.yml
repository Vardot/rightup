  field_content:
  - value: '<p>Instead of a discovery phase measured in months, Common Ground runs one week with the client in the studio every day.</p>

      <p>Monday is listening, Wednesday is sketching, Friday is a decision. Nothing is presented that was not made that week.</p>

      <h2>In practice</h2>

      <p>Clients pay a fixed fee for the week and can walk away at the end of it.</p>

      <blockquote><p>Five days is long enough to be honest and short enough to stay focused.</p><footer>Mia Tran, founder</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'A Melbourne practice compresses months of research into five days in the same room.'
