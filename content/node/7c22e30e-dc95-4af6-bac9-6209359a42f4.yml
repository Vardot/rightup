  field_content:
  - value: '<p><strong>Noor Fasi:</strong> This is The RightUp. I''m Noor Fasi. My guest runs a branding studio that hasn''t shown a slide to a client in years, and it started with a pitch that was over
      in four minutes. Daniel Mercer, welcome.</p>

      <p><strong>Daniel Mercer:</strong> Thanks, Noor. Four minutes and ten seconds. I checked.</p>

      <p><strong>Noor Fasi:</strong> Walk us through it, minute by minute.</p>

      <p><strong>Daniel Mercer:</strong> Minute one, introductions, all fine. Minute two, our first slide, the market overview. Minute three, the client''s chief executive closed her laptop.</p>

      <p><strong>Noor Fasi:</strong> That''s a sign.</p>

      <p><strong>Daniel Mercer:</strong> It''s a very clear sign. Minute four, she asked the question that ended it. She said, you''ve shown me forty slides about my own company. When do I see what you
      think?</p>

      <p><strong>Noor Fasi:</strong> What did you say?</p>

      <p><strong>Daniel Mercer:</strong> I said, it''s on slide twenty two. And she said, then we should have started there.</p>

      <p><strong>Noor Fasi:</strong> What did you change afterwards?</p>

      <p><strong>Daniel Mercer:</strong> Everything about the order. We walk in now with one idea, printed on one sheet of paper, and we talk about it until they either lean in or push back. The research
      still exists. It just waits until someone asks for it.</p>

      <p><strong>Noor Fasi:</strong> And you''ve never gone back to slides?</p>

      <p><strong>Daniel Mercer:</strong> Not once. A few clients have asked for a deck afterwards, for their own board. We make them one. We just never lead with it.</p>

      <p><strong>Noor Fasi:</strong> Daniel Mercer, thank you. That''s The Client Who Fired the Whole Deck, on The RightUp.</p>'
    format: full_html
  field_description:
  - value: A branding studio on the pitch that got rejected in the first four minutes, what they changed after, and why they've never gone back to slides since. The founder walks through the exact meeting,
      minute by minute, including the question that ended it.
