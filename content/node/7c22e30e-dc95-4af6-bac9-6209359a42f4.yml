      value: |-
        <p><strong>Idris Calloway:</strong> Welcome to Last Call. I'm Idris Calloway. Daniel Mercer runs a branding studio in Manchester that has not shown a client a slide in six years, and it started with a pitch that ended in four minutes. Daniel, welcome.</p>
        <p><strong>Daniel Mercer:</strong> Thanks, Idris. Four minutes and ten seconds. I checked the timestamp on the calendar invite.</p>
        <p><strong>Idris Calloway:</strong> Who was the client?</p>
        <p><strong>Daniel Mercer:</strong> A family-owned outdoor clothing company, about two hundred staff, third generation running it. Big rebrand, the first since the eighties. We had forty-two slides.</p>
        <p><strong>Idris Calloway:</strong> Take me through it, minute by minute.</p>
        <p><strong>Daniel Mercer:</strong> Minute one, introductions, coffee, all fine. Minute two, our first content slide, a market overview with competitor logos in a grid. Minute three, the chief executive closes her laptop and puts her hands flat on the table.</p>
        <p><strong>Idris Calloway:</strong> That is not a good sign.</p>
        <p><strong>Daniel Mercer:</strong> It is a very clear sign. Minute four, she asks the question. She says, you have told me about my competitors for two minutes. Have any of you been to one of our shops? And none of us had. We had read the annual report, the customer research, the reviews. Nobody had walked into a shop.</p>
        <p><strong>Idris Calloway:</strong> And that was it?</p>
        <p><strong>Daniel Mercer:</strong> She thanked us and said she did not think it was a fit. Very polite. Our account director held the door open for us, which I always remember.</p>
        <p><strong>Idris Calloway:</strong> What did you change?</p>
        <p><strong>Daniel Mercer:</strong> The first thing was a rule that nobody pitches a retail client without having bought something from them in person. Receipts go in the proposal. Then over about a year we dropped slides entirely. We bring printed sheets, maybe twelve, laid out on the table in the order we want to talk about them. The client can pick them up, turn them over, push one aside.</p>
        <p><strong>Idris Calloway:</strong> Why does paper work better than a screen?</p>
        <p><strong>Daniel Mercer:</strong> A screen gives you one thing to look at, in the order I decided. Paper lets the client interrupt. The question that ended that meeting was a client interrupting a deck that had no room for her. Now the interruption is the format.</p>
        <p><strong>Idris Calloway:</strong> Has it cost you work?</p>
        <p><strong>Daniel Mercer:</strong> Two procurement processes that required a PDF submission. We sent scans of the sheets and lost both. But our win rate on direct pitches went from about one in five to one in three.</p>
        <p><strong>Idris Calloway:</strong> Did you ever go back to that company?</p>
        <p><strong>Daniel Mercer:</strong> We did, four years later, for a smaller job on their repair service. I mentioned the meeting. She said she remembered the market overview slide, and nothing else.</p>
        <p><strong>Idris Calloway:</strong> Daniel Mercer, thank you. That is Last Call.</p>
      format: full_html
  field_description:
    -
      value: "A branding studio on the pitch that got rejected in the first four minutes, what they changed after, and why they've never gone back to slides since. The founder walks through the exact meeting, minute by minute, including the question that ended it."
