    langcode: en
  field_content:
  - value: '<p>By ten on the first morning the queue outside the Tortona warehouses was three deep, and more than half of it was waiting for studios that did not exist five years ago.</p>

      <p>Shows like this one tend to be remembered for a single room, and the argument about whether the rest earned it starts on the second weekend.</p>

      <p>Giulia Ferrante, the fair''s programme director, has been close to it from the start.</p>

      <h2>Background</h2>

      <p>Of the 412 exhibitors this year, 214 have fewer than ten people on staff. In 2019 that figure was 96.</p>

      <p>Budget was fixed before the brief was finished, which is the wrong order and, everyone involved agrees, the usual one.</p>

      <p>The shift has changed what the week sounds like as much as what it shows.</p>

      <blockquote><p>The small studios are not the fringe programme any more. They are the reason people come early.</p><footer>Ferrante</footer></blockquote>

      <h2>The method</h2>

      <p>The fair dropped its minimum stand size and introduced a shared-floor rate, which put eleven studios into a single hall that used to hold two.</p>

      <p>The measure will be whether anything changes afterwards, in the collection or the programme, rather than in the press release.</p>

      <p>The first week brought the kind of attention nobody plans for, and the second brought the criticism that actually changed something.</p>

      <p>They are careful about what they claim. Two of the decisions that look deliberate now were, by their own account, the only option left by the time anyone noticed.</p>

      <h2>Where it goes</h2>

      <p>The fair runs until Sunday. The shared hall is already fully booked for next year.</p>'
