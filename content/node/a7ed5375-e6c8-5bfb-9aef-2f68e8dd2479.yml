    langcode: en
  field_content:
  - value: '<p>The new identity for the Wharf Street Museum is drawn from the building''s floor plan, traced along the route most visitors take.</p>

      <p>Each gallery gets its own fragment of the line, used on signage and tickets.</p>

      <h2>In practice</h2>

      <p>The designers walked the route with visitor counters for a month before drawing anything.</p>

      <blockquote><p>We drew the museum people use, not the one on the architect''s plan.</p><footer>Lead designer</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'The new mark for a harbour museum traces the route visitors actually walk.'
