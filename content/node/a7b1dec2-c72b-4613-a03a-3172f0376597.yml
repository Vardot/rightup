      value: "<p><strong>Beatriz Solano:</strong> This is Office Hours. I'm Beatriz Solano. A listener has accepted her second job and wants to leave her first one properly. Kofi Mensah is creative director at a design agency in Accra and has worked in four studios across two continents. Marta Kowalczyk founded a studio in Kraków after leaving a large consultancy.</p><p><strong>Kofi Mensah:</strong> Leaving well is mostly about the last three weeks.</p><p><strong>Beatriz Solano:</strong> What does a good exit look like?</p><p><strong>Kofi Mensah:</strong> You finish something. Nobody remembers your notice period. They remember the project you left half done, the files called final final v3, and the client who rang and got nobody. Pick one piece of work you can complete before you go, and complete it.</p><p><strong>Marta Kowalczyk:</strong> And write a handover document. Mine was eleven pages when I left the consultancy. Every live project, the client contact, where the files are, what was promised verbally and is not in any email. My old manager still mentions it, nine years later.</p><p><strong>Beatriz Solano:</strong> Should you say why you are leaving?</p><p><strong>Kofi Mensah:</strong> To your manager, briefly and truthfully, and kindly. I said I wanted to work on more public sector projects, which was true. I did not say I found the creative director exhausting, which was also true. In the exit interview, keep it to one constructive point. HR may write it down; your colleagues will hear about it.</p><p><strong>Marta Kowalczyk:</strong> In Poland the notice period is usually one to three months, depending on how long you have been there. Ask if you can leave early once the handover is done. Often they say yes, and it costs nothing.</p><p><strong>Beatriz Solano:</strong> What about the reference?</p><p><strong>Marta Kowalczyk:</strong> That's the one that matters in five years. When I hired my first designer, I rang the studio she had left in 2019. The founder remembered her handover and nothing else. That's what decided it.</p><p><strong>Kofi Mensah:</strong> Ask for a written reference before you leave, while people still remember the details. A letter dated the week you left is worth more than a phone call three years later.</p><p><strong>Beatriz Solano:</strong> Can you take your work for your portfolio?</p><p><strong>Kofi Mensah:</strong> Ask. Never assume. Some clients forbid it. Ask your manager which projects you can show, get it in an email, and take only final, public material.</p><p><strong>Marta Kowalczyk:</strong> Not the working files. Never the working files. That's how people end up in a lawyer's office.</p><p><strong>Beatriz Solano:</strong> Anything on the last day?</p><p><strong>Kofi Mensah:</strong> Say goodbye to the studio manager and the people at reception. They know everyone.</p><p><strong>Marta Kowalczyk:</strong> And clear your desk. Somebody else has to sit there on Monday.</p><p><strong>Beatriz Solano:</strong> Kofi Mensah and Marta Kowalczyk, thank you. You've been listening to Office Hours.</p>"
