  field_content:
  - value: '<p>Bureau Haneul has completed fourteen libraries across South Korea and has not taken a commission for anything else.</p>

      <p>The specialism began by accident, after a competition win in Daejeon led to calls from three neighbouring districts.</p>

      <h2>In practice</h2>

      <p>The studio now keeps a shared database of shelving loads, reading light levels and children''s furniture heights that it updates after every opening.</p>

      <blockquote><p>Every library teaches us something the next one needs.</p><footer>Park Ji-won, director</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'Bureau Haneul has spent eight years on one building type and has no plans to stop.'
