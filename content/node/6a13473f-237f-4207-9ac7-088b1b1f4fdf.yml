  field_content:
  - value: '<p><strong>Idris Calloway:</strong> This is The RightUp, and I''m Idris Calloway. Every January, one studio shuts its doors, retires its name, and opens again a week later as something new.
      My guest has been through that reset six times. Mara Okafor, welcome.</p>

      <p><strong>Mara Okafor:</strong> Thanks, Idris. Seven, actually, if you count the one we abandoned halfway.</p>

      <p><strong>Idris Calloway:</strong> Let''s start with the obvious question. Why would a working studio dissolve itself on purpose?</p>

      <p><strong>Mara Okafor:</strong> Because the version of us that exists in December is tuned for last year''s clients. New name, new structure, often a new office. It forces us to ask what we''re for,
      instead of assuming.</p>

      <p><strong>Idris Calloway:</strong> And the founder? I hear he''s stopped trying to explain it.</p>

      <p><strong>Mara Okafor:</strong> He has. New hires ask him on day one, and he just says, stay until January and you''ll see. He''s not being mysterious. He genuinely can''t put it into a sentence.</p>

      <p><strong>Idris Calloway:</strong> What does the reset actually cost you?</p>

      <p><strong>Mara Okafor:</strong> About three weeks of billing, every single year. And a website we redesign whether we like it or not. Clients get a letter explaining the new name. Most of them find
      it charming. A few find it exhausting.</p>

      <p><strong>Idris Calloway:</strong> So why does it work?</p>

      <p><strong>Mara Okafor:</strong> Nobody gets to coast on a reputation. Every year we pitch like we''re new, because on paper, we are.</p>

      <p><strong>Idris Calloway:</strong> Mara Okafor, thank you. That''s The Studio That Fires Itself Every Year, on The RightUp.</p>'
    format: full_html
  field_description:
  - value: Once a year, this practice dissolves and reforms under a new name, new structure, and often a new office. Nobody on staff is entirely sure why it works, including the founder, who says he's stopped
      trying to explain it to new hires.
