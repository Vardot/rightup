  field_content:
  - value: '<p>Nordvik Sparebank kept the logo it has used since 1979 and changed almost everything else.</p>

      <p>The new identity is a typeface, a grid for forms and a rule that every letter fits on one page.</p>

      <h2>In practice</h2>

      <p>Customer complaints about paperwork fell by a third in the first year.</p>

      <blockquote><p>The logo was never the problem. The forms were.</p><footer>Kari Nordvik, head of brand</footer></blockquote>'
    format: full_html
  field_description:
  - value: 'A regional lender kept its mark and rebuilt everything around it, from forms to signage.'
