    -
      value: "<p><strong>Kenji Arakawa:</strong> You are listening to Material World. I'm Kenji Arakawa, and it is loud here because a ladle of iron has just been poured behind me. This is a foundry in the Black Country, owned by Winifred Ashby, whose family has run it since 1874. Winifred, what are we looking at?</p><p><strong>Winifred Ashby:</strong> A bollard. Specifically a Victorian cannon-style bollard for a borough council in north London, which lost six of them to a delivery lorry last winter. The pattern for it was carved in pear wood in 1886, and it is on that shelf.</p><p><strong>Kenji Arakawa:</strong> Explain a pattern for people who have never been inside a foundry.</p><p><strong>Winifred Ashby:</strong> It is a full-size model of the object, slightly oversized, because iron shrinks about one percent as it cools. We press it into a box of sand bonded with resin, pull it out, and the hole it leaves is the mould. Pour molten iron in at about fourteen hundred degrees, wait, break the sand away, and you have a casting.</p><p><strong>Kenji Arakawa:</strong> And you are still using patterns carved in the 1880s.</p><p><strong>Winifred Ashby:</strong> We hold around three thousand of them. Lamp columns, railings, bench ends, drain grates, the little plates that say which water company owns a stopcock. Pear and mahogany, because they are stable and carve cleanly. A pattern maker spent weeks on a single lamp base. We could scan them and print new ones, and for repairs we sometimes do, but the originals carry detail a scan softens.</p><p><strong>Kenji Arakawa:</strong> Is it actually the same iron?</p><p><strong>Winifred Ashby:</strong> No, and that matters. Victorian street furniture was grey iron, which is brittle. Hit it with a van and it shatters. For new bollards we cast ductile iron, with a little magnesium added so the graphite forms spheres rather than flakes. It bends before it breaks. Same pattern, same look, very different behaviour on impact.</p><p><strong>Kenji Arakawa:</strong> Who is your client now?</p><p><strong>Winifred Ashby:</strong> Councils, heritage trusts, and increasingly architects working on public squares who want a bench that will still be there in eighty years. A landscape practice in Leeds ordered three hundred metres of railing for a park last year. They specified it from our catalogue of 1903.</p><p><strong>Kenji Arakawa:</strong> What does the pour cost you in energy?</p><p><strong>Winifred Ashby:</strong> We moved from a coke cupola to an electric induction furnace in 2019. Melting a tonne of iron takes roughly six hundred kilowatt hours. Our electricity bill is now the biggest single cost after wages, bigger than the scrap iron itself.</p><p><strong>Kenji Arakawa:</strong> And the skills?</p><p><strong>Winifred Ashby:</strong> We have one pattern maker left, aged sixty-three, and an apprentice of nineteen. That is the most fragile thing in this building.</p><p><strong>Kenji Arakawa:</strong> Winifred Ashby, thank you. That is Cast Iron, on Material World.</p>"
      format: full_html
