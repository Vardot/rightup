  - parent_uuid: 1b450ac8-732a-5462-a61f-c33e1bfa9575
    slot: col_1
    uuid: 255810c4-8318-5405-a475-33802a1fc31a
    component_id: sdc.vartheme_bs5_rightup.text
    inputs:
      text:
        value: '<p>The Right Up started from a simple frustration: almost everything written about design and architecture
          is written after the fact, once the dead ends are gone and the rejected version never gets mentioned. What''s left
          is a highlight reel, and highlight reels don''t teach anyone anything. We wanted something closer to the actual
          process — not a takedown, just an honest account of how the work really gets made.</p>'
        format: canvas_html_block
      text_color: text-body
  - parent_uuid: 1b450ac8-732a-5462-a61f-c33e1bfa9575
    slot: col_1
    uuid: 371df731-fa29-5dc7-8cd3-464c54e0f136
    component_id: sdc.vartheme_bs5_rightup.text
    inputs:
      text:
        value: <p>We publish across six areas — studios, architecture, product, branding, process, and culture — because the
          interesting parts of this industry rarely stay inside one lane. Alongside the writing, we run a weekly podcast,
          Last Call, where we sit down with a working studio to talk through one project, start to finish, no polish, no pretending
          it went smoothly.</p>
        format: canvas_html_block
      text_color: text-body
  - parent_uuid: 1b450ac8-732a-5462-a61f-c33e1bfa9575
    slot: col_1
    uuid: c5054354-1f26-5b01-a4b6-dad1a4cbb664
    component_id: sdc.vartheme_bs5_rightup.image
    inputs:
      media:
        CANVAS_ENTITY_REFERENCE:
          target_uuid: 539f71e6-b97d-4900-872b-80d3a10ae9d2
          target_type: media
      ratio: ratio-16x9
      fit: object-fit-cover
      width: w-100
  - parent_uuid: 1b450ac8-732a-5462-a61f-c33e1bfa9575
    slot: col_1
    uuid: fe3d076b-4500-5c42-9a9d-1b515d331905
    component_id: sdc.vartheme_bs5_rightup.text
    inputs:
      text:
        value: <p>The Right Up is written by a small group of contributors, most of whom have worked inside the studios and
          practices we cover. We think that's a feature, not a conflict — it means we know which questions to ask. When we
          have a connection to something we're writing about, we say so, plainly, in the piece itself. We're independently
          run, not funded by any single studio or firm, and sponsored content is always labeled as such.</p>
        format: canvas_html_block
      text_color: text-body
  - parent_uuid: 1b450ac8-732a-5462-a61f-c33e1bfa9575
    slot: col_1
    uuid: 037d3490-378d-5242-8cbc-3304ce194ade
    component_id: sdc.vartheme_bs5_rightup.text
    inputs:
      text:
        value: <p>We publish most weekdays, release a podcast episode weekly, and send a short newsletter every Friday. That's
          the whole operation.</p>
        format: canvas_html_block
      text_color: text-body
  - parent_uuid: 1b450ac8-732a-5462-a61f-c33e1bfa9575
