langcode: en
status: true
dependencies:
  config:
    - user.role.anonymous
    - views.view.rightup_author_articles
  module:
    - eca_base
    - eca_misc
    - eca_user
    - eca_views
    - modeler_api
third_party_settings:
  modeler_api:
    modeler_id: bpmn_io
    label: 'Author pages 404 for visitors'
id: rightup_author_pages_404
weight: 0
template: null
events:
  kernel__controller:
    plugin: 'kernel:controller'
    label: 'Controller found'
    configuration: {  }
    successors:
      -
        id: eca_void_and_condition_user_page
        condition: eca_route_match_user_page
      -
        id: eca_void_and_condition_author_page
        condition: eca_route_match_author_page
conditions:
  eca_route_match_user_page:
    plugin: eca_route_match
    label: 'User page?'
    configuration:
      negate: false
      case: false
      operator: equal
      type: value
      request: 2
      route: entity.user.canonical
  eca_route_match_author_page:
    plugin: eca_route_match
    label: 'Author page?'
    configuration:
      negate: false
      case: false
      operator: equal
      type: value
      request: 2
      route: view.rightup_author_articles.page_author
  eca_current_user_role_anonymous:
    plugin: eca_current_user_role
    label: 'Visitor?'
    configuration:
      negate: false
      role: anonymous
  eca_count_no_articles:
    plugin: eca_count
    label: 'No published articles?'
    configuration:
      negate: false
      case: false
      left: news_by_author
      right: '0'
      operator: equal
      type: numeric
gateways: {  }
actions:
  eca_void_and_condition_user_page:
    label: AND
    plugin: eca_void_and_condition
    configuration: {  }
    successors:
      -
        id: eca_throw_exception_user_page
        condition: eca_current_user_role_anonymous
  eca_throw_exception_user_page:
    label: 'Not found exception'
    plugin: eca_throw_exception
    configuration:
      exception_type: Symfony\Component\HttpKernel\Exception\NotFoundHttpException
      response_message: ''
      log_exception: false
    successors: {  }
  eca_void_and_condition_author_page:
    label: AND
    plugin: eca_void_and_condition
    configuration: {  }
    successors:
      -
        id: eca_token_load_route_param_author
        condition: eca_current_user_role_anonymous
  eca_token_load_route_param_author:
    label: 'Load the author from the route'
    plugin: eca_token_load_route_param
    configuration:
      token_name: page_author_id
      request: 2
      parameter_name: user
      raw_value: true
    successors:
      -
        id: eca_views_query_author_articles
        condition: ''
  eca_views_query_author_articles:
    label: 'Find the author''s published articles'
    plugin: eca_views_query
    configuration:
      token_name: news_by_author
      view_id: rightup_author_articles
      display_id: default
      arguments: '[page_author_id]'
    successors:
      -
        id: eca_throw_exception_author_page
        condition: eca_count_no_articles
  eca_throw_exception_author_page:
    label: 'Not found exception'
    plugin: eca_throw_exception
    configuration:
      exception_type: Symfony\Component\HttpKernel\Exception\NotFoundHttpException
      response_message: ''
      log_exception: false
    successors: {  }
