    workflows.workflow.varbase_editorial_workflow:
      addNodeTypes:
        - podcast
    # Every article carries a byline that links to its author, so a visitor has
    # to be able to open an author page.
    user.role.anonymous:
      grantPermissions:
        - 'access_unpublished node podcast'
        - 'access user profiles'
    user.role.authenticated:
      grantPermissions:
        - 'access_unpublished node podcast'
        - 'access user profiles'
    user.role.content_editor:
      grantPermissions:
        - 'create podcast content'
        - 'delete any podcast content'
        - 'delete own podcast content'
        - 'delete podcast revisions'
        - 'edit any podcast content'
        - 'edit own podcast content'
        - 'revert podcast revisions'
        - 'view podcast revisions'
    user.role.content_admin:
      grantPermissions:
        - 'create podcast content'
        - 'delete any podcast content'
        - 'delete own podcast content'
        - 'delete podcast revisions'
        - 'edit any podcast content'
        - 'edit own podcast content'
        - 'revert podcast revisions'
        - 'view podcast revisions'
    user.role.seo_admin:
      grantPermissions:
        - 'create podcast content'
        - 'delete any podcast content'
        - 'delete own podcast content'
        - 'edit any podcast content'
        - 'edit own podcast content'
        - 'view podcast revisions'
    user.role.site_admin:
      grantPermissions:
        - 'create podcast content'
        - 'delete any podcast content'
        - 'delete own podcast content'
        - 'delete podcast revisions'
        - 'edit any podcast content'
        - 'edit own podcast content'
        - 'revert podcast revisions'
        - 'view podcast revisions'
    # The author fields are added to the profile form and the profile page the
    # site already ships, so they sit beside the picture rather than replacing
    # the upstream displays.
    core.entity_form_display.user.user.default:
      simpleConfigUpdate:
        content.field_author_role:
          type: string_textfield
          weight: 1
          region: content
          settings:
            size: 60
            placeholder: ''
          third_party_settings: {  }
        content.field_author_bio:
          type: string_textarea
          weight: 2
          region: content
          settings:
            rows: 4
            placeholder: ''
          third_party_settings: {  }
    core.entity_view_display.user.user.default:
      simpleConfigUpdate:
        content.field_author_role:
          type: string
          label: hidden
          weight: 1
          region: content
          settings:
            link_to_entity: false
