name: Rightup
type: Site
description: 'Designed for news sites, magazines and editorial teams, this template features ready-made home, blog, features and contact pages, with articles, categories and tags, a media library, search and a contact form.'
recipes:
  - varbase_users_base
  - drupal_cms_admin_ui
  - drupal_cms_anti_spam
  - drupal_cms_authentication
  - drupal_cms_forms
  - drupal_cms_media
  - drupal_cms_privacy_basic
  - drupal_cms_seo_basic
  - drupal_cms_seo_tools
  - drupal_cms_accessibility_tools
  - drupal_cms_search
  - easy_email_express
  - varbase_admin_base
  - varbase_security_base
  - varbase_media_base
  - varbase_editor_base
  - varbase_content_base
  - varbase_workflow_base
  - varbase_seo_base
  - varbase_webform_base
  - varbase_page_base
  - varbase_blog_base
  - varbase_performance_base
  - varbase_demo_content
install:
  - vartheme_bs5_rightup
  - better_exposed_filters
config:
  strict: false
  actions:
    system.site:
      simpleConfigUpdate:
        page.front: '/home'
    system.theme:
      simpleConfigUpdate:
        default: vartheme_bs5_rightup
    # The header search box shows the placeholder as its only prompt, so it
    # carries the header design's wording instead of the Drupal CMS Search
    # default. Set here rather than by patching that third-party recipe.
    views.view.search:
      simpleConfigUpdate:
        display.default.display_options.filters.search_api_fulltext.expose.placeholder: 'Search by keyword'
    package_manager.settings:
      simpleConfigUpdate:
        additional_trusted_composer_plugins:
          - vardot/varbase
          - drupal/rightup
          - composer/installers
          - cweagans/composer-patches
          - oomphinc/composer-installers-extender
          - drupal/core-composer-scaffold
          - drupal/core-project-message
          - dealerdirect/phpcodesniffer-composer-installer
          - phpstan/extension-installer
          - php-http/discovery
          - tbachert/spi
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            # @see recommended.yml
            uri: 'https://git.drupalcode.org/api/v4/projects/201141/repository/files/recommended.yml/raw?ref=HEAD'
            ttl: 1
          drupalorg_jsonapi: []
          varbase_recipes: []
        default_source: recommended
    ckeditor_media_embed.settings:
      setCKEditorMediaEmbedVersion: true
    canvas.component.block.system_menu_block.social-media-menu:
      enable: []
    canvas.component.block.announce_block:
      disable: []
    canvas.component.block.dashboard_placeholder:
      disable: []
    canvas.component.block.dashboard_site_status:
      disable: []
    canvas.component.block.help_block:
      disable: []
    canvas.component.block.local_actions_block:
      disable: []
    canvas.component.block.local_tasks_block:
      disable: []
    canvas.component.block.navigation_dashboard:
      disable: []
    canvas.component.block.navigation_link:
      disable: []
