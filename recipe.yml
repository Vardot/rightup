    workflows.workflow.varbase_editorial_workflow:
      addNodeTypes:
        - podcast
    # Every article carries a byline that links to its author, so a visitor has
    # to be able to open an author page.
    # Every article carries a category eyebrow, and the search results page
    # binds it straight from the term. Canvas resolves a term reference through
    # BOTH of these permissions — without the second it returns NULL and every
    # result row fails to render.
    user.role.anonymous:
      grantPermissions:
        - 'access_unpublished node podcast'
        - 'access user profiles'
        - 'view any term'
        - 'view any term name'
    user.role.authenticated:
      grantPermissions:
        - 'access_unpublished node podcast'
        - 'access user profiles'
        - 'view any term'
        - 'view any term name'
    user.role.content_editor:
      grantPermissions:
        - 'create podcast content'
        - 'delete any podcast content'
        - 'delete own podcast content'
        - 'delete podcast revisions'
        - 'edit any podcast content'
        - 'edit own podcast content'
        - 'revert podcast revisions'
        - 'view podcast revisions'
    user.role.content_admin:
      grantPermissions:
        - 'create podcast content'
        - 'delete any podcast content'
        - 'delete own podcast content'
        - 'delete podcast revisions'
        - 'edit any podcast content'
        - 'edit own podcast content'
        - 'revert podcast revisions'
        - 'view podcast revisions'
    user.role.seo_admin:
      grantPermissions:
        - 'create podcast content'
        - 'delete any podcast content'
        - 'delete own podcast content'
        - 'edit any podcast content'
        - 'edit own podcast content'
        - 'view podcast revisions'
    user.role.site_admin:
      grantPermissions:
        - 'create podcast content'
        - 'delete any podcast content'
        - 'delete own podcast content'
        - 'delete podcast revisions'
        - 'edit any podcast content'
        - 'edit own podcast content'
        - 'revert podcast revisions'
        - 'view podcast revisions'
